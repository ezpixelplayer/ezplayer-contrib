<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0a16">
<title>Decorate the tree</title>
<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --raise: #261d3a; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; --c1: #ff2a2a; --c2: #2a7bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px; gap: 12px; min-height: 100dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 0; font-size: 24px; text-align: center; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: var(--dim); font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; user-select: text; -webkit-user-select: text; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button, .grid button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .btn { min-height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #1a1200; font: 800 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--raise); color: var(--text); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 26px; max-width: 420px; }
  #note { text-align: center; color: #ff9a9a; min-height: 20px; font-size: 15px; max-width: 420px; }
  #timer { text-align: center; color: var(--dim); font-size: 14px; min-height: 18px; }
  .players { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .players span { flex: 1; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players span.turn { border-color: var(--accent); }
  .big { text-align: center; font: 900 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .hidden { display: none !important; }
  .treebox svg { width: 100%; max-width: 340px; display: block; margin: 0 auto; background: radial-gradient(circle at 50% 30%, #0c2a18, #050f09); border-radius: 16px; touch-action: manipulation; }
  .treebox circle { cursor: pointer; }
  .sw { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sw button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw button[aria-pressed="true"] { border-color: #fff; }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kinds button { border-radius: 999px; border: 2px solid var(--line); background: var(--raise); color: var(--text); padding: 7px 11px; font: 700 13px/1.2 system-ui, sans-serif; cursor: pointer; }
  .kinds button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }

</style>
</head>
<body>
<h1>🎄 Decorate the tree</h1>
<div class="panel" id="namePanel">
  <label for="name">Your name</label>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
</div>
<div class="panel">
  <div class="treebox"><svg id="svg" viewBox="0 0 100 120" role="img" aria-label="The tree and its baubles"></svg></div>
  <div class="kinds" id="kinds"></div>
  <div class="sw" id="cols"></div>
  <div class="kinds" id="fxs"></div>
  <button class="btn" id="hang" disabled>Hang my bauble</button>
</div>

<div id="timer"></div>
<div id="msg">Connecting...</div>
<div id="note"></div>
<script>
  const el = (id) => document.getElementById(id);
  let app = null, status = { phase: 'idle', players: [] }, skew = 0, lastNoteText = '', lastNoteAt = 0;
  try { el('name').value = localStorage.getItem('spName') || ''; } catch (e) {}
  el('name').addEventListener('input', () => { try { localStorage.setItem('spName', el('name').value); } catch (e) {} });
  const myName = () => el('name').value.trim();
  const me = () => (app && (status.players || []).find((p) => p.id === app.clientId)) || null;
  const meIndex = () => (app ? (status.players || []).findIndex((p) => p.id === app.clientId) : -1);
  const nowMs = () => Date.now() + skew;
  const say = (t) => { el('msg').textContent = t; };
  const send = (o) => (app ? app.send(o).catch((e) => { el('note').textContent = 'Could not send: ' + e.message; lastNoteAt = Date.now(); }) : Promise.resolve());
  function seg(box, list, cur, set) {
    box.replaceChildren(...list.map(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur));
      b.addEventListener('click', () => { set(v); render(); }); return b;
    }));
  }
  const secsLeft = (at) => Math.max(0, Math.ceil((at - nowMs()) / 1000));
  let draw = () => {}, tickGame = () => '', onStatus = () => {};
  el('namePanel').classList.add('hidden');
  let kind = 'bauble', fx = '', sfx = '';
  try { kind = localStorage.getItem('treeKind') || 'bauble'; fx = localStorage.getItem('treeFx') || ''; } catch (e) {}
  // a decoration drawn on the phone's tree, in its colour (r: its size in the drawing)
  function deco(ns, k, x, y, colour, r, extra) {
    const mk = (tag, at) => { const e = document.createElementNS(ns, tag); for (const [a, v] of Object.entries(at)) e.setAttribute(a, v); return e; };
    const g = mk('g', { transform: `translate(${x} ${y})` }), c = '#' + colour, gold = colour === 'ffc83c' ? '#fff' : '#ffc83c';
    if (k === 'star') { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.42 : r * 1.1; p.push((q * Math.cos(a)).toFixed(2) + ',' + (q * Math.sin(a)).toFixed(2)); } g.append(mk('polygon', { points: p.join(' '), fill: c })); }
    else if (k === 'cane') { const d = `M${-r * 0.3} ${r} L${-r * 0.3} ${-r * 0.2} A${r * 0.45} ${r * 0.45} 0 0 1 ${r * 0.6} ${-r * 0.2}`;
      g.append(mk('path', { d, fill: 'none', stroke: c, 'stroke-width': r * 0.5, 'stroke-linecap': 'round' }), mk('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': r * 0.5, 'stroke-dasharray': `${r * 0.35} ${r * 0.35}` })); }
    else if (k === 'bell') g.append(mk('path', { d: `M${-r} ${r * 0.7} Q${-r * 0.7} ${r * 0.5} ${-r * 0.6} ${-r * 0.2} Q${-r * 0.5} ${-r} 0 ${-r} Q${r * 0.5} ${-r} ${r * 0.6} ${-r * 0.2} Q${r * 0.7} ${r * 0.5} ${r} ${r * 0.7} Z`, fill: c }), mk('circle', { cx: 0, cy: r * 0.85, r: r * 0.22, fill: gold }));
    else if (k === 'present') g.append(mk('rect', { x: -r * 0.8, y: -r * 0.6, width: r * 1.6, height: r * 1.5, fill: c }), mk('rect', { x: -r * 0.15, y: -r * 0.6, width: r * 0.3, height: r * 1.5, fill: gold }),
      mk('rect', { x: -r * 0.8, y: r * 0.05, width: r * 1.6, height: r * 0.3, fill: gold }), mk('circle', { cx: -r * 0.25, cy: -r * 0.8, r: r * 0.22, fill: gold }), mk('circle', { cx: r * 0.25, cy: -r * 0.8, r: r * 0.22, fill: gold }));
    else if (k === 'flake') for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; g.append(mk('line', { x1: -r * Math.cos(a), y1: -r * Math.sin(a), x2: r * Math.cos(a), y2: r * Math.sin(a), stroke: c, 'stroke-width': r * 0.32, 'stroke-linecap': 'round' })); }
    else if (k === 'heart') g.append(mk('path', { d: `M0 ${r} C${-r * 1.6} ${-r * 0.1} ${-r * 0.6} ${-r * 1.3} 0 ${-r * 0.35} C${r * 0.6} ${-r * 1.3} ${r * 1.6} ${-r * 0.1} 0 ${r} Z`, fill: c }));
    else g.append(mk('circle', { r, fill: c }), mk('circle', { cx: -r * 0.35, cy: -r * 0.35, r: r * 0.25, fill: '#ffffff88' }));
    if (extra) for (const [a, v] of Object.entries(extra)) g.setAttribute(a, v);
    return g;
  }
  let sel = -1, col = 0, mine = -1, nextAt = 0, sentAt = 0, starNext = 0;   // sel: a spot, or 'star'   // sentAt: a bauble on its way; the button waits for the answer (3 s at most)
  // a spot (u across, v down the tree's grid) drawn on a tree shape: narrow at the top, wide at the bottom
  const P = (u, v) => [50 + (u - 0.5) * (12 + 76 * v), 12 + v * 96];
  draw = () => {
    const s = status, svg = el('svg'), ns = 'http://www.w3.org/2000/svg', sp = s.spots || [], orn = s.orn || '';
    if (sel === 'star' ? !s.starPick : sel >= 0 && orn[sel] !== '0') sel = -1;
    svg.replaceChildren();
    const tri = document.createElementNS(ns, 'polygon'); tri.setAttribute('points', '50,6 94,110 6,110'); tri.setAttribute('fill', '#14522b'); tri.setAttribute('stroke', '#2c8a4c'); svg.append(tri);
    const trunk = document.createElementNS(ns, 'rect'); trunk.setAttribute('x', 44); trunk.setAttribute('y', 110); trunk.setAttribute('width', 12); trunk.setAttribute('height', 8); trunk.setAttribute('fill', '#5a3412'); svg.append(trunk);
    // the star: in its colour on the lights (or the colour being picked); a visitor can tap it to change its colour
    const star = document.createElementNS(ns, 'polygon'), pts = [];
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 2.6 : 6.4; pts.push((50 + r * Math.cos(a)).toFixed(2) + ',' + (7 + r * Math.sin(a)).toFixed(2)); }
    star.setAttribute('points', pts.join(' ')); star.setAttribute('fill', '#' + (sel === 'star' ? s.colors[col] : s.starCol || 'ffbe28'));
    star.setAttribute('stroke', sel === 'star' ? '#fff' : '#0008'); star.setAttribute('stroke-width', sel === 'star' ? '0.9' : '0.5');
    if (s.starPick) { star.style.cursor = 'pointer'; star.onclick = () => { sel = 'star'; render(); }; }
    svg.append(star);
    const kl = s.kindList || [['bauble', 'Bauble', '🔴']], all = s.allKinds || ['bauble'];
    if (!kl.some(([k]) => k === kind)) kind = kl[0][0];
    sp.forEach(([u, v], i) => {
      const [x, y] = P(u, v), o = orn[i];
      let c;
      if (o === '0' && i === sel) c = deco(ns, kind, x, y, s.colors[col], 4.2, { stroke: '#fff', 'stroke-width': '0.3' });
      else if (o === '0') { c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 3.6); c.setAttribute('stroke-width', '0.7'); c.setAttribute('fill', '#ffffff14'); c.setAttribute('stroke', '#ffffff88'); c.setAttribute('stroke-dasharray', '1.2 1'); }
      else c = deco(ns, all[+(s.kinds || '')[i] || 0] || 'bauble', x, y, s.colors[+o - 1], 3.4, i === mine ? { stroke: '#fff', 'stroke-width': '0.4' } : null);
      c.style.cursor = 'pointer';
      c.onclick = () => { if (orn[i] !== '0') { el('note').textContent = i === mine ? 'That is yours! ✨' : 'This spot is taken. Pick a free one.'; return; } sel = i; render(); };
      svg.append(c);
    });
    el('kinds').classList.toggle('hidden', kl.length < 2 || sel === 'star');
    // the effect: of the decoration, or of the star while the star is picked
    const fl = sel === 'star' ? s.starFxList || [] : s.fxList || [];
    if (sel === 'star') { if (!fl.some(([k]) => k === sfx)) sfx = fl.some(([k]) => k === s.starFx) ? s.starFx : (fl[0] || [''])[0]; }
    else if (!fl.some(([k]) => k === fx)) fx = (fl[0] || [''])[0];
    const curFx = sel === 'star' ? sfx : fx;
    el('fxs').classList.toggle('hidden', fl.length < 2);
    el('fxs').replaceChildren(...fl.map(([k, n, e]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e + ' ' + n; b.setAttribute('aria-pressed', String(k === curFx));
      b.onclick = () => { if (sel === 'star') sfx = k; else { fx = k; try { localStorage.setItem('treeFx', k); } catch (er) {} } render(); }; return b; }));
    el('kinds').replaceChildren(...kl.map(([k, n, e]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e + ' ' + n; b.setAttribute('aria-pressed', String(k === kind));
      b.onclick = () => { kind = k; try { localStorage.setItem('treeKind', k); } catch (er) {} render(); }; return b; }));
    el('cols').replaceChildren(...(s.colors || []).map((h, k) => { const b = document.createElement('button'); b.type = 'button'; b.style.background = '#' + h; b.setAttribute('aria-label', 'Colour ' + (k + 1)); b.setAttribute('aria-pressed', String(k === col)); b.onclick = () => { col = k; render(); }; return b; }));
    const left = Math.ceil(((sel === 'star' ? starNext : nextAt) - Date.now()) / 1000);
    el('hang').textContent = sel === 'star' ? 'Colour the star!' : 'Hang my ' + ((kl.find(([k]) => k === kind) || [0, 'bauble'])[1]).toLowerCase() + '!';
    el('hang').disabled = !app || sel === -1 || left > 0 || s.party || s.phase === 'unconfigured' || Date.now() - sentAt < 3000;
    const n = sp.length, used = n - [...orn].filter((c) => c === '0').length;
    say(s.phase === 'unconfigured' ? s.message : s.party ? '🎉 The tree is full! Party on the lights!'
      : sel === 'star' ? (left > 0 ? 'You can change the star again in ' + left + ' s.' : 'Pick a colour and an effect for the star, then press Colour the star!')
      : left > 0 ? 'You can hang another decoration in ' + left + ' s. (' + used + ' of ' + n + ')'
      : sel < 0 ? 'Tap a free spot on the tree' + (s.starPick ? ', or the star to change its colour' : '') + '. (' + used + ' of ' + n + ' decorations)' + (s.round ? ' The tree is shown unrolled: the spots go all the way round it.' : '') : 'Now pick a decoration, a colour and an effect, then press Hang!');
  };
  tickGame = () => { if (Math.max(nextAt, starNext) > Date.now() - 1000) draw(); return ''; };   // the countdown (draw only: render calls this)
  onStatus = (o, s) => { if (s.lastBy && app && s.lastBy === app.clientId && s.last !== o.last) { mine = s.last; nextAt = Date.now() + (s.every || 0) * 1000; sentAt = 0; }
    if (s.starLastBy && app && s.starLastBy === app.clientId && s.starAt !== o.starAt) { starNext = Date.now() + (s.starEvery || 0) * 1000; sentAt = 0; sel = -1; }
    if (app && s.notices && s.notices[app.clientId]) sentAt = 0; };
  el('hang').addEventListener('click', () => {
    if (sel === 'star') { sentAt = Date.now(); send({ type: 'star', c: col + 1, ...(sfx ? { f: sfx } : {}) }); say('Colouring the star… watch the lights ✨'); el('hang').disabled = true; return; }
    if (sel < 0) return;
    sentAt = Date.now(); send({ type: 'hang', i: sel, c: col + 1, k: kind, ...(fx ? { f: fx } : {}) }); say('Hanging it… watch the lights ✨'); el('hang').disabled = true;
  });

  function render() {
    draw();
    el('timer').textContent = tickGame() || '';
    const n = app && status.notices && status.notices[app.clientId];
    if (n && n !== lastNoteText) { lastNoteText = n; lastNoteAt = Date.now(); el('note').textContent = n; }
    if (!n) lastNoteText = '';
    if (Date.now() - lastNoteAt > 5000) el('note').textContent = '';
  }
  function init() {
    app = EZApp.connect();
    app.onStatus((s, snap) => {
      if (!s) return;
      if (snap && typeof snap.at === 'number') skew = snap.at - Date.now();
      const old = status; status = s; onStatus(old, s);
      render();
    });
    app.ready.then(render).catch((e) => say('Could not reach the player: ' + e.message));
    setInterval(() => { el('timer').textContent = tickGame() || ''; }, 250);
    render();
  }
  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => say('Could not load the app SDK.');
  document.head.appendChild(sdk);
</script>
</body>
</html>
