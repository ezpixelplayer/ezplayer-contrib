<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0a16">
<title>Decorate the tree</title>
<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --raise: #261d3a; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; --c1: #ff2a2a; --c2: #2a7bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px; gap: 12px; min-height: 100dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 0; font-size: 24px; text-align: center; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: var(--dim); font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; user-select: text; -webkit-user-select: text; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button, .grid button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .btn { min-height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #1a1200; font: 800 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--raise); color: var(--text); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 26px; max-width: 420px; }
  #note { text-align: center; color: #ff9a9a; min-height: 20px; font-size: 15px; max-width: 420px; }
  #timer { text-align: center; color: var(--dim); font-size: 14px; min-height: 18px; }
  .players { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .players span { flex: 1; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players span.turn { border-color: var(--accent); }
  .big { text-align: center; font: 900 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .hidden { display: none !important; }
  .treebox svg { width: 100%; max-width: 340px; display: block; margin: 0 auto; background: radial-gradient(circle at 50% 30%, #0c2a18, #050f09); border-radius: 16px; touch-action: manipulation; }
  .treebox circle { cursor: pointer; }
  .sw { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sw button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw button[aria-pressed="true"] { border-color: #fff; }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kinds button { border-radius: 999px; border: 2px solid var(--line); background: var(--raise); color: var(--text); padding: 7px 11px; font: 700 13px/1.2 system-ui, sans-serif; cursor: pointer; }
  .kinds button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }

  .turn { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .turn.hidden { display: none; }
  .turn button { width: 52px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 20px/1 system-ui, sans-serif; cursor: pointer; }
  .turn span { min-width: 110px; text-align: center; font-weight: 700; }
</style>
</head>

<h1>🎄 Decorate the tree</h1>
<div class="panel" id="namePanel">
  <label for="name">Your name</label>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
</div>
<div class="panel">
  <div class="treebox"><svg id="svg" viewBox="0 0 100 120" role="img" aria-label="The tree and its baubles"></svg></div>
  <div class="turn hidden" id="turn"><button type="button" id="turnL" aria-label="Turn the tree to the left">◀</button><span id="turnLabel">Front</span><button type="button" id="turnR" aria-label="Turn the tree to the right">▶</button></div>
  <div class="kinds" id="kinds"></div>
  <div class="sw" id="cols"></div>
  <div class="hint" id="fxHint" style="text-align:center"></div>
  <div class="kinds" id="fxs"></div>
  <button class="btn" id="hang" disabled>Show it on the tree!</button>
</div>

<div id="timer"></div>
<div id="msg">Connecting...</div>

  const me = () => (app && (status.players || []).find((p) => p.id === app.clientId)) || null;

    box.replaceChildren(...list.map(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur));
      b.addEventListener('click', () => { set(v); render(); }); return b;
    }));
  }
  const secsLeft = (at) => Math.max(0, Math.ceil((at - nowMs()) / 1000));
  let draw = () => {}, tickGame = () => '', onStatus = () => {};

/** the colour of a map cell (null: nothing); col: the item's own colour */
function spriteCell(name, gx, gy, col) {
    const m = SPRITES[name];
    if (!m) return null;
    const ch = (m[gy] || '')[gx];
    if (!ch || ch === '.') return null;
    if (ch === 'c') return col;
    if (ch === 'd') return col.map((v) => Math.round(v * 0.55));
    return SPRITE_PAL[ch] || col;
}

/** draws a map b pixels across with its top-left at (0, 0) through P(x, y, rgb, k); tiny sizes become a dot of its main colour */
function drawSprite(P, name, col, b, k = 1) {
    if (!SPRITES[name]) return;
    if (b <= 2) {   // too small for a picture: its most used colour
        const count = new Map();
        for (const row of SPRITES[name]) for (const ch of row) if (ch !== '.') count.set(ch, (count.get(ch) || 0) + 1);
        const main = [...count.entries()].sort((a, b2) => b2[1] - a[1])[0]?.[0] ?? 'c';
        const c = main === 'c' ? col : main === 'd' ? col.map((v) => Math.round(v * 0.55)) : SPRITE_PAL[main] || col;
        for (let y = 0; y < b; y++) for (let x = 0; x < b; x++) P(x, y, c, k);
        return;
    }
    for (let y = 0; y < b; y++) for (let x = 0; x < b; x++) {
        const c = spriteCell(name, Math.min(7, Math.floor((x + 0.5) * 8 / b)), Math.min(7, Math.floor((y + 0.5) * 8 / b)), col);
        if (c) P(x, y, c, k);
    }
}

/** the map at a point of a shape that goes from -1 to 1 both ways (for decorations drawn round a spot): rgb or null */
function spriteAt(name, x, y, col) {
    if (x < -1 || x > 1 || y < -1 || y > 1) return null;
    return spriteCell(name, Math.min(7, Math.floor((x + 1) * 4)), Math.min(7, Math.floor((y + 1) * 4)), col);
}

const CONFETTI = [[255, 60, 60], [255, 200, 60], [60, 160, 255], [80, 220, 100], [255, 110, 200], [170, 90, 255]];
/** what moves in the back of a game, dim: 'snow', 'stars', 'confetti', 'petals', 'leaves', 'bats', 'bubbles' or 'none' */
function backdrop(set, w, h, t, kind) {
    if (!kind || kind === 'none') return;
    const n = Math.ceil(w * h / 40);
    for (let i = 0; i < n; i++) {
        const sx = i * 7.3, sy = i * 13.7;
        if (kind === 'stars') {   // still, twinkling
            const k = 0.5 + 0.5 * Math.sin(t * (1 + (i % 5) * 0.4) + i);
            set(Math.floor(sx % w), Math.floor(sy % h), [40, 40, 60].map((v) => v * k));
            continue;
        }
        if (kind === 'bubbles') {   // rising
            const x = (sx + Math.sin(t * 0.9 + i) * 1.2) % w, y = h - 1 - ((sy % h) + t * (1 + (i % 3) * 0.5)) % h;
            set((x + w) % w, y, [20, 40, 60]);
            continue;
        }
        const fall = kind === 'bats' ? 0.6 : kind === 'leaves' || kind === 'petals' ? 1.1 : 1.5 + (i % 3);
        const sway = kind === 'leaves' || kind === 'petals' ? 2.5 : kind === 'bats' ? 3 : 1.5;
        const x = (sx + Math.sin(t * 0.7 + i) * sway) % w, y = kind === 'bats' ? (sy % h + Math.sin(t * 2 + i) * 1.5 + h) % h : ((sy % h) + t * fall) % h;
        const col = kind === 'snow' ? [26, 26, 36] : kind === 'confetti' ? CONFETTI[i % CONFETTI.length].map((v) => v * 0.16)
            : kind === 'petals' ? [50, 20, 36] : kind === 'leaves' ? (i % 2 ? [55, 25, 5] : [45, 35, 5]) : [26, 10, 40];
        set((x + w) % w, y, col);
        if (kind === 'bats' && Math.floor(t * 6 + i) % 2) { set((x + w + 1) % w, y - 1, col); set((x + w - 1) % w, y - 1, col); }
    }
}

  el('namePanel').classList.add('hidden');
  let kind = 'bauble', fx = [], sfx = null;   // the effects picked (up to 3 together) for the decoration, and for the star
  try { kind = localStorage.getItem('treeKind') || 'bauble'; fx = JSON.parse(localStorage.getItem('treeFx2') || '[]'); } catch (e) {}
  // tapping an effect adds it or takes it away; Steady goes alone; at most maxFx together (the oldest goes)
  const toggle = (list, k, max) => { if (list.includes(k)) return list.length > 1 ? list.filter((x) => x !== k) : list;
    if (k === 'steady' || max < 2) return [k]; const l = list.filter((x) => x !== 'steady').concat(k); return l.slice(-max); };
  // a decoration drawn on the phone's tree, in its colour (r: its size in the drawing)
  function deco(ns, k, x, y, colour, r, extra) {
    const mk = (tag, at) => { const e = document.createElementNS(ns, tag); for (const [a, v] of Object.entries(at)) e.setAttribute(a, v); return e; };
    const g = mk('g', { transform: `translate(${x} ${y})` }), c = '#' + colour, gold = colour === 'ffc83c' ? '#fff' : '#ffc83c';
    if (k === 'star') { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.42 : r * 1.1; p.push((q * Math.cos(a)).toFixed(2) + ',' + (q * Math.sin(a)).toFixed(2)); } g.append(mk('polygon', { points: p.join(' '), fill: c })); }

  }
  // picks: the decorations chosen but not hung yet (spot -> {k, c, f}); sel: the one being changed, or 'star'

  let sel = -1, col = 0, tcol = 0, nextAt = 0, sentAt = 0, starNext = 0, treeNext = 0;   // sel: a spot, 'star' or 'tree'   // sentAt: a bauble on its way; the button waits for the answer (3 s at most)
  // a spot (u across, v down the tree's grid) drawn on a tree shape: narrow at the top, wide at the bottom
  const P = (u, v) => [50 + (u - 0.5) * (12 + 76 * v), 12 + v * 96];
  // a round tree: a spot comes as where it is round the trunk (turns from the front, + to the right); the phone shows
  // the half facing the visitor (va: how far they turned the tree, 360° only), the front in the middle
  let va = 0, lookTimer = 0, swipeX = null;
  const SIDES = ['Front', 'Front right', 'Right side', 'Back right', 'Back', 'Back left', 'Left side', 'Front left'];
  const turnBy = (k) => { va = ((Math.round(va * 8) + k) % 8 + 8) % 8 / 8;
    clearTimeout(lookTimer); if (status.lookGuide) lookTimer = setTimeout(() => send({ type: 'look', a: va }), 300);   // where they stopped turning
    render(); };
  el('turnL').addEventListener('click', () => turnBy(-1));
  el('turnR').addEventListener('click', () => turnBy(1));
  el('svg').addEventListener('touchstart', (e) => { swipeX = status.turn && e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  el('svg').addEventListener('touchend', (e) => { if (swipeX === null) return; const dx = e.changedTouches[0].clientX - swipeX; swipeX = null; if (Math.abs(dx) > 40) turnBy(dx < 0 ? 1 : -1); }, { passive: true });
  draw = () => {
    const s = status, svg = el('svg'), ns = 'http://www.w3.org/2000/svg', sp = s.spots || [], orn = s.orn || '';
    for (const i of [...picks.keys()]) if (orn[i] !== '0' || i >= sp.length) picks.delete(i);
    if (sel === 'star' ? !s.starPick : sel === 'tree' ? !s.treePick : sel >= 0 && !picks.has(sel)) sel = -1;
    const maxD = s.maxDeco || 1;
    svg.replaceChildren();
    // the tree, in its colour (darker on the phone); a visitor can tap it to change its colour
    const tc = sel === 'tree' ? (s.treeCols || [])[tcol] || '1e9e3c' : s.treeCol || '1e9e3c';
    const dk = (h, k) => '#' + [0, 2, 4].map((i) => Math.round(parseInt(h.slice(i, i + 2), 16) * k).toString(16).padStart(2, '0')).join('');
    const tri = document.createElementNS(ns, 'polygon'); tri.setAttribute('points', '50,6 94,110 6,110'); tri.setAttribute('fill', dk(tc, 0.45)); tri.setAttribute('stroke', sel === 'tree' ? '#fff' : dk(tc, 0.8)); tri.setAttribute('stroke-width', sel === 'tree' ? '1' : '0.5');
    if (s.treePick) { tri.style.cursor = 'pointer'; tri.onclick = () => { sel = 'tree'; picks.clear(); render(); }; }
    svg.append(tri);
    const trunk = document.createElementNS(ns, 'rect'); trunk.setAttribute('x', 44); trunk.setAttribute('y', 110); trunk.setAttribute('width', 12); trunk.setAttribute('height', 8); trunk.setAttribute('fill', '#5a3412'); svg.append(trunk);

      const u = uOf(u0);

      c.style.cursor = 'pointer';
      c.onclick = () => {
        if (orn[i] !== '0') { el('note').textContent = mine.has(i) ? 'That is yours! ✨' : 'This spot is taken. Pick a free one.'; return; }
        if (sel === 'star' || sel === 'tree') sel = -1;
        if (picks.has(i)) { if (sel === i) { picks.delete(i); sel = picks.size ? [...picks.keys()].pop() : -1; } else { sel = i; const p = picks.get(i); kind = p.k; col = p.c; fx = [...p.f]; } }
        else if (maxD === 1) { picks.clear(); picks.set(i, { k: kind, c: col, f: [...fx] }); sel = i; }
        else if (picks.size >= maxD) el('note').textContent = `Up to ${maxD} decorations at once. Tap a chosen one twice to take it off.`;

    const okKeys = fl.map(([k]) => k), max = s.maxFx || 3;
    if (sel === 'star') { if (!sfx) sfx = (s.starFx || []).filter((k) => okKeys.includes(k)); sfx = sfx.filter((k) => okKeys.includes(k)).slice(-max); if (!sfx.length && okKeys.length) sfx = [okKeys[0]]; }
    else { fx = fx.filter((k) => okKeys.includes(k)).slice(-max); if (!fx.length && okKeys.length) fx = [okKeys[0]]; }

  function render() {
    draw();
    el('timer').textContent = tickGame() || '';
