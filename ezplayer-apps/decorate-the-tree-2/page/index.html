<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0a16">
<title>Decorate the tree 2.0</title>
<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --raise: #261d3a; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; --c1: #ff2a2a; --c2: #2a7bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px; gap: 12px; min-height: 100dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 0; font-size: 24px; text-align: center; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: var(--dim); font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; user-select: text; -webkit-user-select: text; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button, .grid button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .btn { min-height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #1a1200; font: 800 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--raise); color: var(--text); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 26px; max-width: 420px; }
  #note { text-align: center; color: #ff9a9a; min-height: 20px; font-size: 15px; max-width: 420px; }
  #timer { text-align: center; color: var(--dim); font-size: 14px; min-height: 18px; }
  .players { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .players span { flex: 1; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players span.turn { border-color: var(--accent); }
  .big { text-align: center; font: 900 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .hidden { display: none !important; }
  .tray { display: flex; flex-direction: column; gap: 7px; background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .step { font-weight: 800; color: var(--accent); }
  .trayTop { display: flex; align-items: center; gap: 12px; }
  .trayDeco { flex: none; width: 84px; height: 84px; border: 2px dashed var(--accent); border-radius: 16px; background: radial-gradient(circle at 50% 40%, #183a26, #07140c); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .trayDeco.off { opacity: .4; cursor: default; border-color: var(--line); }
  .trayDeco svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .trayRight { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .trayHint { font-weight: 700; line-height: 1.2; }
  .tray .sw { justify-content: flex-start; gap: 6px; }
  .tray .sw button { width: 30px; height: 30px; border-width: 2px; }
  #fxToggle[aria-expanded="true"] { border-color: var(--accent); }
  .treebox svg { width: 100%; max-width: 340px; display: block; margin: 0 auto; background: radial-gradient(circle at 50% 30%, #0c2a18, #050f09); border-radius: 16px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .treebox svg.dragging { touch-action: none; }
  .placed { cursor: grab; touch-action: none; }
  .xbtn { cursor: pointer; touch-action: none; }
  .ghost { animation: blink .7s steps(2, start) infinite; pointer-events: none; }
  @keyframes blink { to { visibility: hidden; } }
  .drag { position: fixed; left: 0; top: 0; width: 72px; height: 72px; margin: -36px 0 0 -36px; pointer-events: none; z-index: 50; filter: drop-shadow(0 0 6px #fff8); }
  .drag.off { opacity: .45; filter: grayscale(.6); }
  body.dragging { overscroll-behavior: none; }
  .sw { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sw button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw button[aria-pressed="true"] { border-color: #fff; }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kinds button { border-radius: 999px; border: 2px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 9px; font: 700 13px/1.2 system-ui, sans-serif; cursor: pointer; }
  .kinds button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .turn { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .turn.hidden { display: none; }
  .turn button { width: 52px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 20px/1 system-ui, sans-serif; cursor: pointer; }
  .turn span { min-width: 110px; text-align: center; font-weight: 700; }
  #placedHint { text-align: center; min-height: 18px; }
  #placedHint.bad { color: #ff8a8a; font-weight: 700; }

</style>

<h1>🎄 Decorate the tree 2.0</h1>
<div class="panel" id="namePanel">
  <label for="name">Your name</label>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
</div>
<div class="panel">
  <div class="tray" id="tray">
    <div class="step" id="step1">1 · Pick your decoration</div>
    <div class="trayTop">
      <div class="trayDeco" id="trayDeco" role="button" aria-label="Your decoration: drag it onto the tree"><svg id="traySvg" viewBox="-14 -14 28 28"></svg></div>
      <div class="trayRight"><div class="trayHint" id="trayHint">2 · Drag it onto the tree ⬇</div><div class="sw" id="cols"></div></div>
    </div>
    <div class="kinds" id="kinds"></div>
    <div class="kinds"><span class="kinds" id="sizes"></span><button type="button" id="fxToggle" aria-expanded="false">✨ Effects ▾</button></div>
    <div id="fxBox" class="hidden"><div class="hint" id="fxHint" style="text-align:center"></div><div class="kinds" id="fxs"></div></div>
  </div>
  <div class="treebox"><svg id="svg" viewBox="0 0 100 120" role="img" aria-label="The tree and its decorations"></svg></div>
  <div class="turn hidden" id="turn"><button type="button" id="turnL" aria-label="Turn the tree to the left">◀</button><span id="turnLabel">Front</span><button type="button" id="turnR" aria-label="Turn the tree to the right">▶</button></div>
  <div class="hint" id="placedHint"></div>
  <button class="btn" id="hang" disabled>Hang them on the tree!</button>
</div>
<svg id="drag" class="drag hidden" viewBox="-14 -14 28 28" aria-hidden="true"></svg>

<div id="timer"></div>
<div id="msg">Connecting...</div>

  try { el('name').value = localStorage.getItem('spName') || ''; } catch (e) {}
  el('name').addEventListener('input', () => { try { localStorage.setItem('spName', el('name').value); } catch (e) {} });
  const myName = () => el('name').value.trim();
  const me = () => (app && (status.players || []).find((p) => p.id === app.clientId)) || null;
  const meIndex = () => (app ? (status.players || []).findIndex((p) => p.id === app.clientId) : -1);
  const nowMs = () => Date.now() + skew;

  function seg(box, list, cur, set) {
    box.replaceChildren(...list.map(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur));
      b.addEventListener('click', () => { set(v); render(); }); return b;
    }));
  }
  const secsLeft = (at) => Math.max(0, Math.ceil((at - nowMs()) / 1000));
  let draw = () => {}, tickGame = () => '', onStatus = () => {};

/** the colour of a map cell (null: nothing); col: the item's own colour */
function spriteCell(name, gx, gy, col) {
    const m = SPRITES[name];
    if (!m) return null;
    const ch = (m[gy] || '')[gx];
    if (!ch || ch === '.') return null;
    if (ch === 'c') return col;
    if (ch === 'd') return col.map((v) => Math.round(v * 0.55));
    return SPRITE_PAL[ch] || col;
}

/** draws a map b pixels across with its top-left at (0, 0) through P(x, y, rgb, k); tiny sizes become a dot of its main colour */
function drawSprite(P, name, col, b, k = 1) {
    if (!SPRITES[name]) return;
    if (b <= 2) {   // too small for a picture: its most used colour
        const count = new Map();
        for (const row of SPRITES[name]) for (const ch of row) if (ch !== '.') count.set(ch, (count.get(ch) || 0) + 1);
        const main = [...count.entries()].sort((a, b2) => b2[1] - a[1])[0]?.[0] ?? 'c';
        const c = main === 'c' ? col : main === 'd' ? col.map((v) => Math.round(v * 0.55)) : SPRITE_PAL[main] || col;
        for (let y = 0; y < b; y++) for (let x = 0; x < b; x++) P(x, y, c, k);
        return;
    }
    for (let y = 0; y < b; y++) for (let x = 0; x < b; x++) {
        const c = spriteCell(name, Math.min(7, Math.floor((x + 0.5) * 8 / b)), Math.min(7, Math.floor((y + 0.5) * 8 / b)), col);
        if (c) P(x, y, c, k);
    }
}

/** the map at a point of a shape that goes from -1 to 1 both ways (for decorations drawn round a spot): rgb or null */
function spriteAt(name, x, y, col) {
    if (x < -1 || x > 1 || y < -1 || y > 1) return null;
    return spriteCell(name, Math.min(7, Math.floor((x + 1) * 4)), Math.min(7, Math.floor((y + 1) * 4)), col);
}

const CONFETTI = [[255, 60, 60], [255, 200, 60], [60, 160, 255], [80, 220, 100], [255, 110, 200], [170, 90, 255]];
/** what moves in the back of a game, dim: 'snow', 'stars', 'confetti', 'petals', 'leaves', 'bats', 'bubbles' or 'none' */
function backdrop(set, w, h, t, kind) {
    if (!kind || kind === 'none') return;
    const n = Math.ceil(w * h / 40);
    for (let i = 0; i < n; i++) {
        const sx = i * 7.3, sy = i * 13.7;
        if (kind === 'stars') {   // still, twinkling
            const k = 0.5 + 0.5 * Math.sin(t * (1 + (i % 5) * 0.4) + i);
            set(Math.floor(sx % w), Math.floor(sy % h), [40, 40, 60].map((v) => v * k));
            continue;
        }

    el('cols').replaceChildren(...(pickTree ? sw(s.treeCols || [], tcol, (k) => { tcol = k; }, 'Tree colour') : sw(s.colors || [], col, (k) => { col = k; upd(); }, 'Colour')));
    const left = Math.ceil(((pickStar ? starNext : pickTree ? treeNext : nextAt) - Date.now()) / 1000);
    el('hang').textContent = pickStar ? 'Colour the star!' : pickTree ? 'Colour the tree!' : placed.length > 1 ? `Hang them on the tree! (${placed.length})` : 'Hang it on the tree!';
    el('hang').disabled = !app || (!pickStar && !pickTree && !placed.length) || left > 0 || s.party || s.phase === 'unconfigured' || Date.now() - sentAt < 3000;
    const bad = placed.find((p) => p.bad);
    el('placedHint').textContent = bad ? '⚠️ ' + bad.bad + '. Drag it somewhere else.' : placed.length ? `${placed.length} placed (dashed): drag to move, ✕ to take off.` : '';
    el('placedHint').classList.toggle('bad', !!bad);
    const others = (s.ghosts || []).filter((g) => !app || g.by !== app.clientId).length;
    const n = decos.length, of = ' (' + n + ' of ' + (s.maxOn || n) + ')';
    say(s.phase === 'unconfigured' ? s.message : s.party ? '🎉 The tree is full! Party on the lights!'
      : pickTree ? (left > 0 ? 'You can change the tree\'s colour again in ' + left + ' s.' : 'Pick a colour for the tree, then press Colour the tree!')
      : pickStar ? (left > 0 ? 'You can change the star again in ' + left + ' s.' : 'Pick a colour and effects for the star, then press Colour the star!')
      : left > 0 ? 'You can hang more decorations in ' + left + ' s.' + of
      : !placed.length ? 'Drag your decoration onto the tree: it blinks on the real tree where you hold it.' + of + (s.turn ? ' Turn the tree with ◀ ▶ (or swipe) to decorate it all the way round.' : s.round ? ' This is the front of the tree, as you see it.' : '') + (s.starPick || s.treePick ? ' Tap ' + [s.starPick && 'the star', s.treePick && 'the tree'].filter(Boolean).join(' or ') + ' to change its colour.' : '') + (others ? ' 👀 Someone else is placing one too.' : '')
      : (placed.length < maxD ? 'Drag more, or press ' : 'Press ') + (placed.length > 1 ? 'Hang them on the tree!' : 'Hang it on the tree!') + of);
  };
  tickGame = () => { if (Math.max(nextAt, starNext, treeNext) > Date.now() - 1000) draw(); return ''; };
  onStatus = (o, s) => {
    if (s.lastBy && app && s.lastBy === app.clientId && s.hung !== o.hung) {   // mine were hung: those go from the placed ones (refused ones stay, with why)
      const okSet = new Set(s.lastOk || []), hungNow = sentList.filter((_, i) => okSet.has(i));
      placed = placed.filter((p) => !hungNow.includes(p));
      mine = new Set(s.lastSet || []); sel = -1; nextAt = Date.now() + (s.every || 0) * 1000; sentAt = 0; sentList = [];
    }
    if (s.starLastBy && app && s.starLastBy === app.clientId && s.starAt !== o.starAt) { sfx = null; starNext = Date.now() + (s.starEvery || 0) * 1000; sentAt = 0; sel = -1; }
    if (s.treeLastBy && app && s.treeLastBy === app.clientId && s.treeAt !== o.treeAt) { treeNext = Date.now() + (s.starEvery || 0) * 1000; sentAt = 0; sel = -1; }
    if (s.party && !o.party) { placed = []; sel = -1; }
    if (app && s.notices && s.notices[app.clientId]) sentAt = 0;
  };
  el('hang').addEventListener('click', () => {
    if (sel === 'tree') { sentAt = Date.now(); send({ type: 'tree', c: tcol + 1 }); say('Colouring the tree… watch the lights 🎄'); el('hang').disabled = true; return; }
    if (sel === 'star') { sentAt = Date.now(); send({ type: 'star', c: col + 1, ...(sfx && sfx.length ? { f: sfx } : {}) }); say('Colouring the star… watch the lights ✨'); el('hang').disabled = true; return; }
    if (!placed.length) return;
    sentAt = Date.now(); sentList = [...placed];
    send({ type: 'hang', d: placed.map((p) => [p.u, p.v, p.k, p.c + 1, p.f, p.s]) });
    say((placed.length > 1 ? 'Hanging them' : 'Hanging it') + '… watch the lights ✨'); el('hang').disabled = true;
  });

  function render() {
    draw();
    el('timer').textContent = tickGame() || '';
    const n = app && status.notices && status.notices[app.clientId];
    if (n && n !== lastNoteText) { lastNoteText = n; lastNoteAt = Date.now(); el('note').textContent = n; }
    if (!n) lastNoteText = '';
    if (Date.now() - lastNoteAt > 5000) el('note').textContent = '';
  }
  function init() {
    app = EZApp.connect();
    app.onStatus((s, snap) => {
      if (!s) return;
      if (snap && typeof snap.at === 'number') skew = snap.at - Date.now();
      const old = status; status = s; onStatus(old, s);
      render();
    });
    app.ready.then(render).catch((e) => say('Could not reach the player: ' + e.message));
    setInterval(() => { el('timer').textContent = tickGame() || ''; }, 250);
    render();
  }
  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => say('Could not load the app SDK.');
  document.head.appendChild(sdk);
</script>
</body>
</html>
