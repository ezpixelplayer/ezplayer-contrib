<div class="panel" id="setup">
  <label>Play with</label>
  <div class="seg hidden" id="ctl"></div>
  <button class="btn" id="go" disabled>New game</button>
</div>
<div class="panel hidden" id="play">
  <div class="stats"><span>Score <b id="score">0</b></span><span id="lives">💚💚💚</span><span>Wave <b id="wave">1</b></span></div>
  <div class="strip" id="strip"><div class="finger" id="finger"></div><div class="ship" id="ship">🚀</div></div>
  <button class="btn hidden" id="fire">🔥 FIRE</button>
  <button class="btn ghost hidden" id="quit">Stop</button>
</div>
