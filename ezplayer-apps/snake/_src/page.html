<div class="panel" id="setup">
  <button class="btn" id="go" disabled>New game</button>
</div>
<div class="panel hidden" id="play">
  <div class="score"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <div class="pad" id="pad">
    <span></span><button type="button" data-d="0" aria-label="Up">▲</button><span></span>
    <button type="button" data-d="3" aria-label="Left">◀</button><div class="mid">swipe<br>or tap</div><button type="button" data-d="1" aria-label="Right">▶</button>
    <span></span><button type="button" data-d="2" aria-label="Down">▼</button><span></span>
  </div>
  <button class="btn ghost hidden" id="quit">Stop</button>
</div>
