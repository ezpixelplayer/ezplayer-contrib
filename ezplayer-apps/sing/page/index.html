<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0a16">
<title>Sing</title>
<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --raise: #261d3a; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; --c1: #ff2a2a; --c2: #2a7bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px; gap: 12px; min-height: 100dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 0; font-size: 24px; text-align: center; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: var(--dim); font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; user-select: text; -webkit-user-select: text; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button, .grid button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .btn { min-height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #1a1200; font: 800 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--raise); color: var(--text); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 26px; max-width: 420px; }
  #note { text-align: center; color: #ff9a9a; min-height: 20px; font-size: 15px; max-width: 420px; }
  #timer { text-align: center; color: var(--dim); font-size: 14px; min-height: 18px; }
  .players { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .players span { flex: 1; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players span.turn { border-color: var(--accent); }
  .big { text-align: center; font: 900 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .hidden { display: none !important; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border-radius: 999px; border: 2px solid var(--line); background: var(--raise); color: var(--text); padding: 10px 14px; font: 700 15px/1.2 system-ui, sans-serif; cursor: pointer; }
  .chips button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .rec { display: block; margin: 6px auto; width: 130px; height: 130px; border-radius: 50%; border: 4px solid #ff4d4d; background: #3a1414; color: #fff; font: 800 17px/1.3 system-ui, sans-serif; cursor: pointer; }
  .rec.on { background: #ff2a2a; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .meter { height: 10px; border-radius: 5px; background: var(--raise); overflow: hidden; }
  .meter div { height: 100%; width: 0; background: linear-gradient(90deg, #39d353, #ffd23f, #ff2a2a); transition: width .08s; }
  .row2 { display: flex; gap: 8px; }
  .row2 .btn { flex: 1; }

</style>
</head>
<body>
<h1>🎤 Sing</h1>
<div class="panel" id="namePanel">
  <label for="name">Your name</label>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
</div>
<div class="panel">
  <label>1. Who sings it?</label>
  <div class="chips" id="who"></div>
</div>
<div class="panel">
  <label>2. Record your song (up to <span id="maxs">10</span> seconds)</label>
  <button class="rec" id="rec" type="button">🎙️<br>Record</button>
  <div class="meter"><div id="meter"></div></div>
  <div class="hint" id="time" style="text-align:center"></div>
  <div class="row2" id="btns"></div>
</div>
<div class="panel"><div id="sstat" style="text-align:center"></div></div>

<div id="timer"></div>
<div id="msg">Connecting...</div>
<div id="note"></div>
<script>
  const el = (id) => document.getElementById(id);
  let app = null, status = { phase: 'idle', players: [] }, skew = 0, lastNoteText = '', lastNoteAt = 0;
  try { el('name').value = localStorage.getItem('spName') || ''; } catch (e) {}
  el('name').addEventListener('input', () => { try { localStorage.setItem('spName', el('name').value); } catch (e) {} });
  const myName = () => el('name').value.trim();
  const me = () => (app && (status.players || []).find((p) => p.id === app.clientId)) || null;
  const meIndex = () => (app ? (status.players || []).findIndex((p) => p.id === app.clientId) : -1);
  const nowMs = () => Date.now() + skew;
  const say = (t) => { el('msg').textContent = t; };
  const send = (o) => (app ? app.send(o).catch((e) => { el('note').textContent = 'Could not send: ' + e.message; lastNoteAt = Date.now(); }) : Promise.resolve());
  function seg(box, list, cur, set) {
    box.replaceChildren(...list.map(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur));
      b.addEventListener('click', () => { set(v); render(); }); return b;
    }));
  }
  const secsLeft = (at) => Math.max(0, Math.ceil((at - nowMs()) / 1000));
  let draw = () => {}, tickGame = () => '', onStatus = () => {};
  let who = '', rec = null, clip = null, url = '', busy = false, rate = 11025;
  const button = (cls, text, f) => { const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = text; b.addEventListener('click', f); return b; };
  function wavBlob(a) {   // 16-bit samples -> a WAV to listen to on the phone
    const n = a.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, a[i], true);
    return new Blob([buf], { type: 'audio/wav' });
  }
  async function start() {
    if (!window.isSecureContext) { el('time').textContent = 'Phones only allow the microphone on a secure page: open this page through the show\'s link (https), not the home network address.'; return; }
    if (!navigator.mediaDevices?.getUserMedia) { el('time').textContent = 'This phone\'s browser cannot record. Try Chrome or Safari.'; return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) { el('time').textContent = 'The microphone is not allowed. Allow it in the browser to sing!'; return; }
    const ctx = new (window.AudioContext || window.webkitAudioContext)(), src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1), mute = ctx.createGain();
    mute.gain.value = 0;
    const ratio = ctx.sampleRate / rate, out = [], max = status.maxSecs || 10; let acc = 0, cnt = 0, pos = 0;
    proc.onaudioprocess = (ev) => {
      const d = ev.inputBuffer.getChannelData(0); let peak = 0;
      for (let i = 0; i < d.length; i++) { acc += d[i]; cnt++; pos++; peak = Math.max(peak, Math.abs(d[i])); if (pos >= ratio) { out.push(acc / cnt); acc = 0; cnt = 0; pos -= ratio; } }
      el('meter').style.width = Math.min(100, peak * 140) + '%';
      const secs = out.length / rate; el('time').textContent = `Recording… ${secs.toFixed(1)} s of ${max}`;
      if (secs >= max) stop();
    };
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    rec = { ctx, stream, proc, out };
    clip = null; if (url) { URL.revokeObjectURL(url); url = ''; }
    el('rec').classList.add('on'); el('rec').innerHTML = '⏹<br>Stop'; render();
  }
  function stop() {
    if (!rec) return;
    const { ctx, stream, proc, out } = rec; rec = null;
    try { proc.disconnect(); stream.getTracks().forEach((t) => t.stop()); ctx.close(); } catch (e) {}
    el('rec').classList.remove('on'); el('rec').innerHTML = '🎙️<br>Record again'; el('meter').style.width = '0';
    let a = 0, b = out.length; const quiet = (x) => Math.abs(x) < 0.02;   // the silence at both ends goes
    while (a < b && quiet(out[a])) a++;
    while (b > a && quiet(out[b - 1])) b--;
    a = Math.max(0, a - Math.floor(rate * 0.15)); b = Math.min(out.length, b + Math.floor(rate * 0.25));
    const part = out.slice(a, Math.min(b, a + rate * (status.maxSecs || 10)));
    if (part.length < rate * 0.5) { el('time').textContent = 'That was too short or too quiet. Try again, a bit louder!'; render(); return; }
    clip = Int16Array.from(part, (x) => Math.max(-32768, Math.min(32767, Math.round(x * 32767))));
    url = URL.createObjectURL(wavBlob(clip));
    el('time').textContent = `Recorded ${(clip.length / rate).toFixed(1)} s. Listen to it, or send it!`; render();
  }
  el('rec').addEventListener('click', () => (rec ? stop() : start()));
  async function sendIt() {
    if (!clip || busy || !who) return;
    busy = true; render();
    const bytes = new Uint8Array(clip.buffer, clip.byteOffset, clip.byteLength), PART = 45000, of = Math.ceil(bytes.length / PART), id = Math.random().toString(36).slice(2, 10);
    try {
      for (let n = 0; n < of; n++) {
        let s = ''; const p = bytes.subarray(n * PART, (n + 1) * PART);
        for (let i = 0; i < p.length; i += 8192) s += String.fromCharCode.apply(null, p.subarray(i, i + 8192));
        el('time').textContent = `Sending… ${Math.round(n / of * 100)}%`;
        await app.send({ type: 'sing', a: 'part', id, n, of, s: who, rate, d: btoa(s) });
      }
      el('time').textContent = 'Sent! Listen and watch the lights: your song plays in a moment.';
      clip = null;
    } catch (e) { el('time').textContent = 'Could not send: ' + e.message; send({ type: 'sing', a: 'cancel' }); }
    setTimeout(() => { busy = false; render(); }, 1500);
    render();
  }
  draw = () => {
    const s = status, list = s.singers || [];
    el('namePanel').classList.add('hidden');
    rate = s.rate || 11025; el('maxs').textContent = s.maxSecs || 10;
    if (!list.some((x) => x.k === who)) who = (list[0] || {}).k || '';
    el('who').replaceChildren(...list.map((x) => { const b = button('', `${x.e} ${x.n}`, () => { who = x.k; render(); }); b.setAttribute('aria-pressed', String(x.k === who)); return b; }));
    const bt = [];
    if (clip && !rec) {
      const go = button('btn', '🎤 Send it to the lights!', sendIt); go.disabled = busy || !who || s.phase === 'unconfigured';
      bt.push(go, button('btn ghost', '▶️ Listen', () => { try { new Audio(url).play(); } catch (e) {} }));
    }
    el('btns').replaceChildren(...bt);
    const me = app?.clientId, pos = (s.queue || []).indexOf(me);
    el('sstat').textContent = s.now && s.now.id === me ? `🎶 Your song is playing now! Watch ${s.now.who}!` : pos >= 0 ? `Your song is number ${pos + 1} in line.` : s.now ? `🎶 Now singing: ${s.now.who}` : '';
    el('sstat').parentElement.classList.toggle('hidden', !el('sstat').textContent);
    say(s.phase === 'unconfigured' ? s.message : '');
  };

  function render() {
    draw();
    el('timer').textContent = tickGame() || '';
    const n = app && status.notices && status.notices[app.clientId];
    if (n && n !== lastNoteText) { lastNoteText = n; lastNoteAt = Date.now(); el('note').textContent = n; }
    if (!n) lastNoteText = '';
    if (Date.now() - lastNoteAt > 5000) el('note').textContent = '';
  }
  function init() {
    app = EZApp.connect();
    app.onStatus((s, snap) => {
      if (!s) return;
      if (snap && typeof snap.at === 'number') skew = snap.at - Date.now();
      const old = status; status = s; onStatus(old, s);
      render();
    });
    app.ready.then(render).catch((e) => say('Could not reach the player: ' + e.message));
    setInterval(() => { el('timer').textContent = tickGame() || ''; }, 250);
    render();
  }
  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => say('Could not load the app SDK.');
  document.head.appendChild(sdk);
</script>
</body>
</html>
