<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0a16">
<title>Photo in pixels</title>
<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --raise: #261d3a; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; --c1: #ff2a2a; --c2: #2a7bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px; gap: 12px; min-height: 100dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 0; font-size: 24px; text-align: center; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: var(--dim); font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; user-select: text; -webkit-user-select: text; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button, .grid button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .btn { min-height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #1a1200; font: 800 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--raise); color: var(--text); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 26px; max-width: 420px; }
  #note { text-align: center; color: #ff9a9a; min-height: 20px; font-size: 15px; max-width: 420px; }
  #timer { text-align: center; color: var(--dim); font-size: 14px; min-height: 18px; }
  .players { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .players span { flex: 1; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players span.turn { border-color: var(--accent); }
  .big { text-align: center; font: 900 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .hidden { display: none !important; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row2 .btn { font-size: 16px; }
  .preview { display: flex; justify-content: center; background: #000; border-radius: 12px; padding: 8px; }
  .preview canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; max-height: 50vh; border-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 40px; padding: 0 12px; border-radius: 20px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 14px system-ui, sans-serif; cursor: pointer; }
  .chips button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .inline { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; }
  .small { color: var(--dim); font-size: 12px; margin: 0; text-align: center; }

</style>
</head>
<body>
<h1>📸 Photo in pixels</h1>
<div class="panel" id="namePanel">
  <label for="name">Your name</label>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
</div>
<div class="panel" id="shoot">
  <div class="row2">
    <button class="btn" id="cam" type="button">📸 Take a selfie</button>
    <button class="btn ghost" id="pick" type="button">🖼️ Pick a photo</button>
  </div>
  <input type="file" id="fileCam" accept="image/*" capture="user" class="hidden">
  <input type="file" id="filePick" accept="image/*" class="hidden">
  <div class="preview hidden" id="pv"><canvas id="canvas"></canvas></div>
  <div class="hidden" id="tools">
    <label for="zoom">Zoom in on your face</label>
    <input type="range" id="zoom" min="1" max="3" step="0.05" value="1.3">
    <label class="inline"><input type="checkbox" id="mirror"> Mirror</label>
    <label>Frame</label>
    <div class="chips" id="frames"></div>
    <label>Look</label>
    <div class="chips" id="styles"></div>
  </div>
  <p class="small">Only a tiny picture of a few squares leaves your phone, and it is not saved: it is forgotten as soon as it has been on the lights.</p>
</div>
<button class="btn" id="send" style="max-width:420px" disabled>Show it on the lights!</button>

<div id="timer"></div>
<div id="msg">Connecting...</div>
<div id="note"></div>
<script>
  const el = (id) => document.getElementById(id);
  let app = null, status = { phase: 'idle', players: [] }, skew = 0, lastNoteText = '', lastNoteAt = 0;
  try { el('name').value = localStorage.getItem('spName') || ''; } catch (e) {}
  el('name').addEventListener('input', () => { try { localStorage.setItem('spName', el('name').value); } catch (e) {} });
  const myName = () => el('name').value.trim();
  const me = () => (app && (status.players || []).find((p) => p.id === app.clientId)) || null;
  const meIndex = () => (app ? (status.players || []).findIndex((p) => p.id === app.clientId) : -1);
  const nowMs = () => Date.now() + skew;
  const say = (t) => { el('msg').textContent = t; };
  const send = (o) => (app ? app.send(o).catch((e) => { el('note').textContent = 'Could not send: ' + e.message; lastNoteAt = Date.now(); }) : Promise.resolve());
  function seg(box, list, cur, set) {
    box.replaceChildren(...list.map(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur));
      b.addEventListener('click', () => { set(v); render(); }); return b;
    }));
  }
  const secsLeft = (at) => Math.max(0, Math.ceil((at - nowMs()) / 1000));
  let draw = () => {}, tickGame = () => '', onStatus = () => {};
  const FRAME_E = { snow: '❄️', hearts: '💖', stars: '⭐', santa: '🎅', rainbow: '🌈', confetti: '🎊', gold: '🥇', silver: '🥈', leaves: '🍂', petals: '🌸', spooky: '🎃', pastel: '🍭', babyblue: '💙', babypink: '🩷', night: '🌙', usa: '🇺🇸' };
  let img = null, frame = null, framePicked = false, style = '', pw = 0, ph = 0, px = null;
  el('namePanel').classList.add('hidden');
  el('cam').addEventListener('click', () => el('fileCam').click());
  el('pick').addEventListener('click', () => el('filePick').click());
  for (const id of ['fileCam', 'filePick']) el(id).addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { img = await createImageBitmap(f, { imageOrientation: 'from-image' }); } catch (err) {
      img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); }).catch(() => null);
    }
    if (!img) { el('note').textContent = 'That photo could not be opened.'; return; }
    el('mirror').checked = id === 'fileCam';
    shrink(); render();
  });
  el('zoom').addEventListener('input', () => { shrink(); render(); });
  el('mirror').addEventListener('change', () => { shrink(); render(); });
  // the look, as the lights will show it (the same as the app's)
  function styled(r, g, b) {
    if (style === 'bw') { const v = Math.round(0.3 * r + 0.59 * g + 0.11 * b); return [v, v, v]; }
    if (style === 'warm') { const v = 0.3 * r + 0.59 * g + 0.11 * b; return [Math.min(255, v * 1.15 + 20), Math.min(255, v * 0.95 + 8), Math.max(0, v * 0.7)]; }
    if (style === 'pop') { const q = (v) => (v < 70 ? 0 : v < 170 ? 140 : 255); return [q(r), q(g), q(b)]; }
    const m = (r + g + b) / 3; return [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round((m + (v - m) * 1.25) * 1.1))));
  }
  /** the photo cut to the matrix's shape (the middle, zoomed in), shrunk to pw x ph squares */
  function shrink() {
    if (!img || !pw) return;
    const z = +el('zoom').value, iw = img.width, ih = img.height, want = pw / ph;
    let cw = iw, chh = iw / want; if (chh > ih) { chh = ih; cw = ih * want; }
    cw /= z; chh /= z;
    const sx = (iw - cw) / 2, sy = (ih - chh) / 2.4;     // a little above the middle, where faces are
    const c = document.createElement('canvas'); c.width = pw; c.height = ph;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
    if (el('mirror').checked) { g.translate(pw, 0); g.scale(-1, 1); }
    g.drawImage(img, sx, Math.max(0, sy), cw, chh, 0, 0, pw, ph);
    px = g.getImageData(0, 0, pw, ph).data;
  }
  function drawPreview() {
    const c = el('canvas'), k = Math.max(1, Math.floor(260 / Math.max(pw, ph)));
    c.width = pw * k; c.height = ph * k;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) {
      const i = (y * pw + x) * 4, [r, gg, b] = styled(px[i], px[i + 1], px[i + 2]);
      g.fillStyle = 'rgb(' + r + ',' + gg + ',' + b + ')'; g.beginPath(); g.arc(x * k + k / 2, y * k + k / 2, k * 0.42, 0, 7); g.fill();
    }
  }
  function chips(box, list, cur, set) {
    box.replaceChildren(...list.map(([k, n]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = n;
      b.setAttribute('aria-pressed', String(k === cur)); b.addEventListener('click', () => { set(k); render(); }); return b; }));
  }
  draw = () => {
    const s = status;
    if (s.size && (s.size[0] !== pw || s.size[1] !== ph)) { [pw, ph] = s.size; shrink(); }
    const fl = (s.frames || []).map(([k, n]) => [k, (FRAME_E[k] || '🖼️') + ' ' + n]);
    if (s.noFrame !== false) fl.push(['', '⬛ No frame']);
    if (!framePicked || !fl.some(([k]) => k === frame)) frame = fl.length ? fl[0][0] : '';
    chips(el('frames'), fl, frame, (v) => { frame = v; framePicked = true; });
    const sl = s.styles || [['natural', 'Natural colours']];
    if (!sl.some(([k]) => k === style)) style = sl[0][0];
    chips(el('styles'), sl, style, (v) => { style = v; });
    el('pv').classList.toggle('hidden', !px); el('tools').classList.toggle('hidden', !px);
    if (px) drawPreview();
    el('send').disabled = !app || !px || s.phase === 'unconfigured';
    const mine = (s.queue || []).findIndex((q) => app && q.id === app.clientId);
    let t = s.message || '';
    if (s.now && app && s.now.id === app.clientId) t = '📸 Your photo is on the lights now!';
    else if (mine >= 0) t = mine === 0 ? 'Your photo is next!' : 'Your photo is number ' + (mine + 1) + ' in line.';
    else if (!px) t = 'Take a selfie or pick a photo.';
    say(t);
  };
  el('send').addEventListener('click', () => {
    if (!px) return;
    const rgb = new Uint8Array(pw * ph * 3);
    for (let i = 0, j = 0; i < px.length; i += 4) { rgb[j++] = px[i]; rgb[j++] = px[i + 1]; rgb[j++] = px[i + 2]; }
    let bin = ''; for (let i = 0; i < rgb.length; i++) bin += String.fromCharCode(rgb[i]);
    send({ type: 'photo', w: pw, h: ph, px: btoa(bin), frame, style });
    el('send').disabled = true; say('Sending…'); setTimeout(render, 1200);
  });

  function render() {
    draw();
    el('timer').textContent = tickGame() || '';
    const n = app && status.notices && status.notices[app.clientId];
    if (n && n !== lastNoteText) { lastNoteText = n; lastNoteAt = Date.now(); el('note').textContent = n; }
    if (!n) lastNoteText = '';
    if (Date.now() - lastNoteAt > 5000) el('note').textContent = '';
  }
  function init() {
    app = EZApp.connect();
    app.onStatus((s, snap) => {
      if (!s) return;
      if (snap && typeof snap.at === 'number') skew = snap.at - Date.now();
      const old = status; status = s; onStatus(old, s);
      render();
    });
    app.ready.then(render).catch((e) => say('Could not reach the player: ' + e.message));
    setInterval(() => { el('timer').textContent = tickGame() || ''; }, 250);
    render();
  }
  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => say('Could not load the app SDK.');
  document.head.appendChild(sdk);
</script>
</body>
</html>
