<div class="panel" id="lobby">
  <div class="big" id="turnHead" style="font-size:22px"></div>
  <div class="hint" id="turnInfo" style="text-align:center"></div>
  <button class="btn" id="join" type="button">🎹 Play the lights</button>
  <button class="btn ghost hidden" id="leave" type="button">Leave the line</button>
</div>
<div class="panel hidden" id="playing">
  <div class="row2"><div class="big" id="left" style="font-size:22px;flex:1;text-align:left"></div><button class="btn ghost" id="done" type="button" style="flex:0 0 auto;width:auto;padding:0 16px">I'm done</button></div>
  <div class="sw" id="cols"></div>
  <div class="keys" id="keys"></div>
  <div class="hint" style="text-align:center">Tap a key to flash its lights, hold it to keep them on. Several fingers play several keys.</div>
</div>
