<div class="panel" id="setup">
  <label>Play with</label>
  <div class="seg" id="ways"></div>
  <p class="tip" id="wayTip"></p>
  <button class="btn" id="go" disabled>New game</button>
  <button class="btn hidden" id="join">Join the game</button>
</div>
<div class="panel hidden" id="play">
  <div class="light" id="light"><span id="word"></span></div>
  <div class="round" id="round"></div>
  <div class="meter hidden" id="meter"><div id="meterFill"></div><div class="mark" id="meterMark"></div></div>
  <div class="plist" id="plist"></div>
  <button class="btn hidden" id="startNow">Start now</button>
  <button class="btn ghost hidden" id="quit">Leave the game</button>
</div>
