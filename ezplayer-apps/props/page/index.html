<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --raise: #261d3a; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; --c1: #ff2a2a; --c2: #2a7bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px; gap: 12px; min-height: 100dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 0; font-size: 24px; text-align: center; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: var(--dim); font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; user-select: text; -webkit-user-select: text; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button, .grid button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; }

  .btn { min-height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #1a1200; font: 800 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--raise); color: var(--text); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 26px; max-width: 420px; }
  #note { text-align: center; color: #ff9a9a; min-height: 20px; font-size: 15px; max-width: 420px; }
  #timer { text-align: center; color: var(--dim); font-size: 14px; min-height: 18px; }
  .players { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .players span { flex: 1; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .big { text-align: center; font: 900 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .hidden { display: none !important; }
  .choose { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .choose.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
  .choose button { min-height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 13px/1.2 system-ui, sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
  .choose button .e { font-size: 24px; }

  .choose button .busy { font-size: 11px; color: var(--accent); font-weight: 600; }
  .pals { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .pals button { border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 13px/1.2 system-ui, sans-serif; cursor: pointer; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
  .pals button .bar { height: 12px; border-radius: 6px; }
  .pals button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .sw { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .sw button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; font: 800 14px/1 system-ui, sans-serif; color: #0009; }
  .sw button[aria-pressed="true"] { border-color: #fff; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 14px/1 system-ui, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  #preview { width: 100%; max-width: 360px; display: block; margin: 0 auto; background: #000; border-radius: 10px; image-rendering: pixelated; }

</style>

<body>
<h1>✨ Props of the show</h1>
<div class="panel" id="namePanel">
  <label for="name">Your name</label>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
</div>
<div class="panel">
  <label>1. The prop</label>
  <div class="choose" id="props"></div>
</div>
<div class="panel">

</div>

<div class="panel">
  <canvas id="preview" width="240" height="96" aria-label="A preview of the effect on a pair of wings"></canvas>
  <div class="hint" style="text-align:center">Preview on a pair of wings</div>
</div>
<button class="btn" id="send" type="button" style="max-width:420px">Light it up!</button>

<div id="timer"></div>
<div id="msg">Connecting...</div>
<div id="note"></div>
<script>
  const el = (id) => document.getElementById(id);
  let app = null, status = { phase: 'idle', players: [] }, skew = 0, lastNoteText = '', lastNoteAt = 0;
  try { el('name').value = localStorage.getItem('spName') || ''; } catch (e) {}
  el('name').addEventListener('input', () => { try { localStorage.setItem('spName', el('name').value); } catch (e) {} });
  const myName = () => el('name').value.trim();
  const me = () => (app && (status.players || []).find((p) => p.id === app.clientId)) || null;
  const meIndex = () => (app ? (status.players || []).findIndex((p) => p.id === app.clientId) : -1);
  const nowMs = () => Date.now() + skew;
  const say = (t) => { el('msg').textContent = t; };
  const send = (o) => (app ? app.send(o).catch((e) => { el('note').textContent = 'Could not send: ' + e.message; lastNoteAt = Date.now(); }) : Promise.resolve());
  function seg(box, list, cur, set) {
    box.replaceChildren(...list.map(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur));
      b.addEventListener('click', () => { set(v); render(); }); return b;
    }));
  }
  const secsLeft = (at) => Math.max(0, Math.ceil((at - nowMs()) / 1000));
  let draw = () => {}, tickGame = () => '', onStatus = () => {};
// This code is copyrighted.  The copyright holder is determined as documented in the Github repository history.

/**
 * Props of the show for the ShowPlay apps that light real models (props, play the lights, sing, mixer):
 *   - a prop: a name, an icon and a list of models (or groups), from one settings line "🦇 Bats | BatLeft, BatRight | across";
 *   - where each pixel of a model is, from EZPlayer's overlay targets (detail=nodes), as u across and v up, 0..1;
 *   - the 12 prop effects and 11 palettes of ShowPlay, drawn for each model;
 *   - the show's groups, read from xlights_rgbeffects.xml in the show folder.
 * No dependencies; nothing here talks to the phones.
 */




const PALETTES = {
    rainbow: ['Rainbow', ['ff0000', 'ff8000', 'ffff00', '00ff00', '00ffff', '0000ff', 'ff00ff']],
    halloween: ['Halloween', ['ff6a00', '7a00ff', '39ff14', 'ff6a00', '7a00ff']],
    christmas: ['Christmas', ['ff0000', '00ff40', 'ffffff', 'ff0000', '00ff40']],
    fire: ['Fire', ['300000', 'ff2000', 'ff8000', 'ffd000', 'ffffa0']],
    ice: ['Ice', ['ffffff', '80e0ff', '0060ff', '00ffff']],
    ocean: ['Ocean', ['001060', '0060ff', '00e0d0', '80ffff']],
    candy: ['Candy', ['ff4fd8', 'ffffff', 'ff2a2a', 'ffffff']],
    forest: ['Forest', ['004000', '00a030', '80ff40', 'ffd23f']],
    sunset: ['Sunset', ['ff2a00', 'ff7a1a', 'ffd23f', '9b5cff']],
    gold: ['Gold', ['ffd700', 'ff9f00', 'fff3b0']],
    party: ['Party', ['ff00aa', '00ffcc', 'ffee00', '7a00ff']],
};
const PROP_FX = {
    flap: 'Flap', wave: 'Colour wave', rise: 'Rising', spin: 'Spin', breathe: 'Breathe', sparkle: 'Sparkle',
    fire: 'Fire', ripple: 'Ripples', chase: 'Chase', comet: 'Comet', confetti: 'Confetti', solid: 'Colours',
};
const FX_EMOJI = { flap: '🦋', wave: '🌊', rise: '⬆️', spin: '🌀', breathe: '💗', sparkle: '✨', fire: '🔥', ripple: '💧', chase: '🏃', comet: '☄️', confetti: '🎊', solid: '🎨' };
const SPEEDS = [0.5, 1.0, 1.8];
/** the page's 9 colours for "my colours" */
const MY_COLS = ['ff2a2a', 'ff8a1a', 'ffd23f', '39d353', '2ad4ff', '2a7bff', 'a35cff', 'ff5cc8', 'ffffff'];

const rgb = (h) => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];

/** 256 colours blended from a palette; wrap = the last colour blends back into the first */
function palLut(cols, wrap = true) {
    let cs = (cols.length ? cols : ['ffffff']).map(rgb);
    if (cs.length === 1) cs = [cs[0], cs[0].map((v) => Math.floor(v / 3))];
    const pts = wrap ? cs.concat([cs[0]]) : cs, out = new Uint8Array(768);
    for (let i = 0; i < 256; i++) {
        const f = wrap ? i / 256 * (pts.length - 1) : i / 255 * (pts.length - 1), k = Math.min(Math.floor(f), pts.length - 2), x = f - k;
        for (let j = 0; j < 3; j++) out[i * 3 + j] = Math.floor(pts[k][j] + (pts[k + 1][j] - pts[k][j]) * x);
    }
    return out;
}

/** where the body is for a wing: 1 = the right edge (a left wing), 0 = the left edge (a right wing), null = the middle */
function modelSide(name) {
    const n = name.toLowerCase();
    if (n.includes('left') || /(^|[ _-])l\d*$/.test(n)) return 1;
    if (n.includes('right') || /(^|[ _-])r\d*$/.test(n)) return 0;
    return null;
}

/** one model: how to send to it and where each pixel is (u across, v up, both 0..1) */
class Geom {
    constructor(model, fmt, n, u, v, w = 0, h = 0) {
        Object.assign(this, { model, fmt, n, u, v, w, h });
        const root = modelSide(model);
        this.d = Float32Array.from(u, (x) => (root !== null ? Math.abs(x - root) : Math.min(1, Math.abs(x - 0.5) * 2)));
        this.ang = Float32Array.from(u, (x, i) => { const mx = root === 1 ? 1 - x : x; return ((Math.atan2(v[i] - 0.5, mx - 0.5) / 6.2832) % 1 + 1) % 1; });
        this.rad = Float32Array.from(u, (x, i) => Math.min(1, Math.hypot(x - 0.5, v[i] - 0.5) * 1.42));
        this.order = Float32Array.from(u, (x, i) => i / Math.max(1, n - 1));
    }
    /** where the middle of the model is in the layout (for the keyboard order), set by geomsFor */
}

const MAX_GRID = 40000;

async function getJson(url) {
    const r = await fetch(url, { signal: AbortSignal.timeout(60000) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
}

/** [Geom] for the models (each once), with the problems found; across = one effect over all of them together */
async function geomsFor(base, models, across = false) {
    const raw = [], problems = [];
    for (const m of models) {
        let t;
        try { t = (await getJson(`${base}/api/ezp/overlays/targets?model=${encodeURIComponent(m)}&detail=nodes`)).targets?.find((x) => (x.target ?? x.model) === m); }
        catch (e) { problems.push(`${m}: ${e.message}`); continue; }
        if (!t) { problems.push(`${m} is not in the show`); continue; }
        const world = t.nodes?.world ?? [], local = t.nodes?.local ?? [];
        const cx = [], cy = [];
        for (let i = 0; i < t.nodeCount; i++) { cx.push(world[i * 3] ?? 0); cy.push(world[i * 3 + 1] ?? 0); }
        if (t.width && t.height && !t.subModel) {
            let w = t.width, h = t.height;
            if (w * h > MAX_GRID) { const k = Math.sqrt(MAX_GRID / (w * h)); w = Math.max(1, Math.floor(w * k)); h = Math.max(1, Math.floor(h * k)); }
            raw.push({ m, grid: true, w, h, cx, cy });
            continue;
        }
        if (!t.nodeCount) { problems.push(`${m} has no pixels`); continue; }
        const xs = [], ys = [];
        const useLocal = !across && local.length >= t.nodeCount * 3;
        for (let i = 0; i < t.nodeCount; i++) {
            xs.push(useLocal ? local[i * 3] : world[i * 3] ?? 0);
            ys.push(useLocal ? local[i * 3 + 1] : world[i * 3 + 1] ?? 0);
        }
        raw.push({ m, grid: false, xs, ys, cx, cy });
    }
    const all = raw.filter((g) => !g.grid);
    const ax = all.flatMap((g) => g.xs), ay = all.flatMap((g) => g.ys);
    const out = raw.map((g) => {
        let geom;
        if (g.grid) {
            const u = [], v = [];
            for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) { u.push(x / Math.max(1, g.w - 1)); v.push(1 - y / Math.max(1, g.h - 1)); }
            geom = new Geom(g.m, 'grid', g.w * g.h, u, v, g.w, g.h);
        } else {
            const bx = across ? ax : g.xs, by = across ? ay : g.ys;
            const x0 = Math.min(...bx), x1 = Math.max(...bx), y0 = Math.min(...by), y1 = Math.max(...by);
            geom = new Geom(g.m, 'nodes', g.xs.length, g.xs.map((x) => (x - x0) / ((x1 - x0) || 1)), g.ys.map((y) => (y - y0) / ((y1 - y0) || 1)));
        }
        geom.x = g.cx.length ? g.cx.reduce((a, b) => a + b, 0) / g.cx.length : 0;
        geom.y = g.cy.length ? g.cy.reduce((a, b) => a + b, 0) / g.cy.length : 0;
        return geom;
    });
    return { geoms: out, problems };
}

/** an effect on some models: frame(i, t, dt) -> the bytes for model i (RGB per pixel) */
class PropFx {
    constructor(geoms, fx, cols, speed = 1) {
        this.geoms = geoms; this.fx = PROP_FX[fx] ? fx : 'solid'; this.sp = speed;
        this.lut = palLut(cols, this.fx !== 'fire');
        this.state = geoms.map((g) => new Float32Array(g.n));
        this.colr = geoms.map((g) => new Uint8Array(g.n));
    }
    setColours(cols) { this.lut = palLut(cols, this.fx !== 'fire'); }
    frame(gi, t, dt, out = null) {
        const g = this.geoms[gi], n = g.n, fx = this.fx, lut = this.lut, sin = Math.sin, buf = out ?? new Uint8Array(n * 3);
        t *= this.sp; dt *= this.sp;
        const put = (i, p, b) => { const c = (Math.floor(((p % 1) + 1) % 1 * 256) & 255) * 3; buf[i * 3] = lut[c] * b; buf[i * 3 + 1] = lut[c + 1] * b; buf[i * 3 + 2] = lut[c + 2] * b; };
        if (fx === 'flap') { const beat = 0.55 + 0.45 * sin(t * 6); for (let i = 0; i < n; i++) { const d = g.d[i]; put(i, d * 0.6 + t * 0.15, beat * (0.35 + 0.65 * (0.5 + 0.5 * sin((d * 2.2 - t * 2.4) * 6.2832)))); } }
        else if (fx === 'wave') for (let i = 0; i < n; i++) put(i, g.d[i] - t * 0.25, 1);
        else if (fx === 'rise') for (let i = 0; i < n; i++) put(i, g.v[i] - t * 0.3, 1);
        else if (fx === 'spin') for (let i = 0; i < n; i++) put(i, g.ang[i] + t * 0.25, 1);
        else if (fx === 'breathe') { const b = 0.15 + 0.85 * (0.5 + 0.5 * sin(t * 2.2)); for (let i = 0; i < n; i++) put(i, t * 0.05 + g.d[i] * 0.3, b); }
        else if (fx === 'ripple') for (let i = 0; i < n; i++) { const r = g.rad[i]; put(i, r * 1.5 - t * 0.4, 0.25 + 0.75 * (0.5 + 0.5 * sin((r * 3 - t * 1.2) * 6.2832))); }
        else if (fx === 'chase') for (let i = 0; i < n; i++) { const o = g.order[i]; put(i, o * 3 - t * 0.3, (((o * 12 - t * 1.2) % 1) + 1) % 1 < 0.5 ? 1 : 0.08); }
        else if (fx === 'comet') { const head = ((t * 0.25) % 1 + 1) % 1; for (let i = 0; i < n; i++) { const b = Math.max(0, 1 - (((head - g.order[i]) % 1) + 1) % 1 * 6); put(i, head + 0.3 * b, b); } }
        else if (fx === 'fire') for (let i = 0; i < n; i++) {
            const x = g.u[i], y = g.v[i], nse = (sin(x * 9 + t * 2.1 + sin(y * 5 + t * 3.3)) + sin(y * 7 - t * 4.7 + x * 3) + 2) / 4;
            put(i, Math.max(0, Math.min(0.999, (1.1 - y * 1.25) * (0.45 + 0.75 * nse))), 1);
        } else if (fx === 'sparkle' || fx === 'confetti') {
            const st = this.state[gi], cr = this.colr[gi], sp = fx === 'sparkle';
            const decay = dt <= 0 ? 1 : 0.25 ** (dt * (sp ? 3 : 1.5)), chance = dt * (sp ? 2.5 : 1.2);
            for (let i = 0; i < n; i++) {
                st[i] *= decay;
                if (Math.random() < chance) { st[i] = 1; cr[i] = Math.floor(Math.random() * 256); }
                put(i, sp ? cr[i] / 256 + t * 0.05 : cr[i] / 256, Math.max(sp ? 0.12 : 0, st[i]));
            }
        } else for (let i = 0; i < n; i++) put(i, g.d[i] * 0.8 + t * 0.03, 1);
        return buf;
    }
}

/** the palette's colours, or the visitor's own (1 to 3 of MY_COLS) */
function coloursOf(pal, mine) {
    if (PALETTES[pal]) return PALETTES[pal][1];
    const m = (Array.isArray(mine) ? mine : []).filter((i) => Number.isInteger(i) && i >= 0 && i < MY_COLS.length).slice(0, 3).map((i) => MY_COLS[i]);
    return m.length ? m : PALETTES.rainbow[1];
}

/** props from the settings: one a line, "<icon> <name> | <model or group>, … | across" (up to 12, 64 models each) */
function propsOf(text, groups = {}) {
    const out = [];
    for (const line of String(text ?? '').split('\n')) {
        const parts = line.split('|').map((x) => x.trim());
        if (parts.length < 2 || !parts[0] || !parts[1]) continue;
        const m = /^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)?\s*(.*)$/u.exec(parts[0]);
        const name = m[2].slice(0, 24).trim() || 'Prop';
        const models = [];
        for (const x of parts[1].split(',').map((y) => y.trim()).filter(Boolean)) for (const y of groups[x] ?? [x]) if (!models.includes(y)) models.push(y);
        out.push({ n: name, e: m[1] || '✨', models: models.slice(0, 64), across: /across|spread/i.test(parts[2] ?? '') });
        if (out.length >= 12) break;
    }
    return out;
}

/** the show's xlights_rgbeffects.xml (text), or '' */
function showXml() {
    const dir = process.env.EZP_SHOW_FOLDER;
    if (!dir) return '';
    try { return fs.readFileSync(path.join(dir, 'xlights_rgbeffects.xml'), 'utf8'); } catch (e) { return ''; }
}

const attr = (tag, name) => { const m = new RegExp(`\\s${name}="([^"]*)"`).exec(tag); return m ? m[1].replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>') : null; };


/** model groups of the show: name -> [models] (groups inside groups opened up; submodels give their model) */
function groupsOf(xml) {
    const raw = {};
    for (const m of xml.matchAll(/<modelGroup\b[^>]*>/g)) { const n = attr(m[0], 'name'); if (n) raw[n] = (attr(m[0], 'models') ?? '').split(',').map((x) => x.trim()).filter(Boolean); }
    const open = (g, seen) => raw[g].flatMap((m) => (raw[m] && !seen.has(m) ? open(m, new Set([...seen, m])) : [m.split('/')[0]]));
    const out = {};
    for (const g of Object.keys(raw)) { const ms = [...new Set(open(g, new Set([g])))]; if (ms.length) out[g] = ms; }
    return out;
}

  let prop = -1, fx = '', pal = '', mine = [0], speed = 1, eng = null, engKey = '';
  try { const v = JSON.parse(localStorage.getItem('propsPick') || '{}'); fx = v.fx || ''; pal = v.pal || ''; speed = v.speed ?? 1; mine = v.mine || [0]; } catch (e) {}
  const keep = () => { try { localStorage.setItem('propsPick', JSON.stringify({ fx, pal, speed, mine })); } catch (e) {} };
  const button = (text, f) => { const b = document.createElement('button'); b.type = 'button'; if (text) b.textContent = text; b.addEventListener('click', f); return b; };
  // the preview: a pair of feathered wings, 12 x 8 pixels each, drawn with the same maths as the app
  const WING = [];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 12; x++) if (x <= 11 - Math.abs(y - 2.5) * 1.4 || (y > 3 && x < 12 - (y - 3) * 2.2)) WING.push([x, y]);
  const wingGeom = (side) => new Geom(side === 'L' ? 'WingLeft' : 'WingRight', 'nodes', WING.length,
    WING.map(([x]) => (side === 'L' ? 11 - x : x) / 11), WING.map(([, y]) => 1 - y / 7));
  const GEOMS = [wingGeom('L'), wingGeom('R')];
  let t0 = performance.now(), lastT = 0;
  function preview() {
    const c = el('preview'), g = c.getContext('2d'), t = (performance.now() - t0) / 1000;
    const key = [fx, pal, mine.join(), speed].join('|');
    if (key !== engKey) { engKey = key; eng = new PropFx(GEOMS, fx || 'solid', coloursOf(pal, mine), SPEEDS[speed]); }
    g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
    const dt = Math.min(0.2, t - lastT); lastT = t;
    GEOMS.forEach((gm, gi) => {
      const b = eng.frame(gi, t, dt);
      WING.forEach(([x, y], i) => {
        g.fillStyle = `rgb(${b[i * 3]},${b[i * 3 + 1]},${b[i * 3 + 2]})`;
        g.beginPath(); g.arc(gi === 0 ? 114 - x * 9 : 126 + x * 9, y * 11 + 9, 3.6, 0, 6.3); g.fill();
      });
    });
    requestAnimationFrame(preview);
  }
  requestAnimationFrame(preview);

  draw = () => {
    el('namePanel').classList.add('hidden');
    const s = status, props = s.props || [];
    if (!props[prop]?.ok) prop = props.findIndex((p) => p.ok);
    el('props').replaceChildren(...props.map((p, i) => {
      const b = button('', () => { prop = i; render(); });
      const e = document.createElement('span'); e.className = 'e'; e.textContent = p.e; b.append(e, p.n);
      if (p.now) { const z = document.createElement('span'); z.className = 'busy'; z.textContent = p.now.id === app?.clientId ? 'yours, now' : p.queue.length ? `busy · ${p.queue.length} waiting` : `busy · ${p.now.left} s`; b.append(z); }
      b.disabled = !p.ok; b.setAttribute('aria-pressed', String(i === prop)); return b;
    }));
    const fl = s.fx || [];
    if (!fl.some(([k]) => k === fx)) fx = (fl[0] || [''])[0];
    el('fxs').replaceChildren(...fl.map(([k, n, e]) => {
      const b = button('', () => { fx = k; keep(); render(); });
      const sp = document.createElement('span'); sp.className = 'e'; sp.textContent = e; b.append(sp, n); b.setAttribute('aria-pressed', String(k === fx)); return b;
    }));
    const pl = (s.pals || []).map(([k, n, c]) => [k, n, c]);
    if (s.mine) pl.push(['mine', 'My colours', mine.map((i) => (s.myCols || [])[i] || 'ffffff')]);
    if (!pl.some(([k]) => k === pal)) pal = (pl[0] || [''])[0];
    el('pals').replaceChildren(...pl.map(([k, n, c]) => {
      const b = button('', () => { pal = k; keep(); render(); });
      const bar = document.createElement('span'); bar.className = 'bar'; bar.style.background = c.length > 1 ? `linear-gradient(90deg, ${c.map((x) => '#' + x).join(', ')})` : '#' + c[0];
      b.append(n, bar); b.setAttribute('aria-pressed', String(k === pal)); return b;
    }));
    el('mine').classList.toggle('hidden', pal !== 'mine');
    el('mine').replaceChildren(...(s.myCols || []).map((h, i) => {
      const b = button('', () => { const j = mine.indexOf(i); if (j >= 0) { if (mine.length > 1) mine.splice(j, 1); } else { mine.push(i); if (mine.length > 3) mine.shift(); } keep(); render(); });
      b.style.background = '#' + h; b.setAttribute('aria-label', 'Colour ' + (i + 1)); b.setAttribute('aria-pressed', String(mine.includes(i)));
      if (mine.includes(i)) b.textContent = String(mine.indexOf(i) + 1); return b;
    }));
    seg(el('speed'), [[0, '🐢 Slow'], [1, 'Normal'], [2, '🐇 Fast']], speed, (v) => { speed = v; keep(); });
    el('send').disabled = !app || s.phase === 'unconfigured' || prop < 0;
    const p = props[prop], me = app?.clientId;
    let t = s.message || '';
    const minePos = props.map((q) => q.queue.indexOf(me));
    const on = props.findIndex((q) => q.now && q.now.id === me);
    if (on >= 0) t = `✨ Your ${props[on].n} is lighting up now!`;
    else if (minePos.some((x) => x >= 0)) { const i = minePos.findIndex((x) => x >= 0); t = minePos[i] === 0 ? `Your ${props[i].n} is next!` : `Your ${props[i].n} is number ${minePos[i] + 1} in line.`; }
    else if (p && p.now && !s.queueMode) t = `${p.n} is busy; yours will replace it.`;
    say(t);
  };
  el('send').addEventListener('click', () => {
    if (prop < 0) return;
    send({ type: 'prop', i: prop, fx, pal, mine, speed });
    say('Sending…');
  });

  function render() {
    draw();
    el('timer').textContent = tickGame() || '';
    const n = app && status.notices && status.notices[app.clientId];
    if (n && n !== lastNoteText) { lastNoteText = n; lastNoteAt = Date.now(); el('note').textContent = n; }
    if (!n) lastNoteText = '';
    if (Date.now() - lastNoteAt > 5000) el('note').textContent = '';
  }
  function init() {
    app = EZApp.connect();
    app.onStatus((s, snap) => {
      if (!s) return;
      if (snap && typeof snap.at === 'number') skew = snap.at - Date.now();
      const old = status; status = s; onStatus(old, s);
      render();
    });
    app.ready.then(render).catch((e) => say('Could not reach the player: ' + e.message));
    setInterval(() => { el('timer').textContent = tickGame() || ''; }, 250);
    render();
  }
  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => say('Could not load the app SDK.');
  document.head.appendChild(sdk);
</script>
</body>
</html>
