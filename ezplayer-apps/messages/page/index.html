<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0a16">
<title>Messages on the lights</title>
<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --raise: #261d3a; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; --c1: #ff2a2a; --c2: #2a7bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px; gap: 12px; min-height: 100dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 0; font-size: 24px; text-align: center; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: var(--dim); font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; user-select: text; -webkit-user-select: text; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button, .grid button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .btn { min-height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #1a1200; font: 800 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--raise); color: var(--text); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #msg { text-align: center; font-weight: 700; font-size: 18px; min-height: 26px; max-width: 420px; }
  #note { text-align: center; color: #ff9a9a; min-height: 20px; font-size: 15px; max-width: 420px; }
  #timer { text-align: center; color: var(--dim); font-size: 14px; min-height: 18px; }
  .players { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .players span { flex: 1; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players span.turn { border-color: var(--accent); }
  .big { text-align: center; font: 900 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .hidden { display: none !important; }
  .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; width: 100%; max-width: 420px; }
  .tabs button { min-height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--text); font: 700 15px/1 system-ui, sans-serif; cursor: pointer; }
  .tabs button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border-radius: 999px; border: 1px solid var(--line); background: var(--raise); color: var(--text); padding: 8px 12px; font: 600 14px/1.2 system-ui, sans-serif; cursor: pointer; }
  .sw { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw button[aria-pressed="true"] { border-color: #fff; }
  .fxs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fxs button { min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 15px/1.2 system-ui, sans-serif; cursor: pointer; }
  .fxs button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }
  canvas { width: 100%; border-radius: 10px; background: #000; touch-action: none; image-rendering: pixelated; }
  .row2 { display: flex; gap: 8px; }
  .row2 .btn { flex: 1; }
  .gifs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .gifs button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px; border: 2px solid var(--line); background: var(--raise); color: var(--text); font: 700 12px/1.2 system-ui, sans-serif; cursor: pointer; }
  .gifs button img { width: 64px; height: 64px; image-rendering: pixelated; background: #000; border-radius: 8px; }
  .gifs button[aria-pressed="true"] { border-color: var(--accent); background: #3a2f12; }

</style>
</head>
<body>
<h1>💬 Messages on the lights</h1>
<div class="panel" id="namePanel">
  <label for="name">Your name</label>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
</div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="pText">
  <label for="text" id="textLabel">Your message</label>
  <input type="text" id="text" maxlength="40" autocomplete="off" placeholder="Merry Christmas!">
  <div class="chips" id="presets"></div>
  <label>Colour</label>
  <div class="sw" id="colours"></div>
</div>
<div class="panel hidden" id="pGif">
  <label>Pick a picture</label>
  <div class="gifs" id="gifs"></div>
</div>
<div class="panel hidden" id="pFx">
  <label>Pick an effect</label>
  <div class="fxs" id="fxs"></div>
</div>
<div class="panel hidden" id="pDraw">
  <canvas id="canvas"></canvas>
  <div class="sw" id="pens"></div>
  <div class="row2"><button class="btn ghost" id="clear" type="button">Clear</button></div>
</div>
<button class="btn" id="send" style="max-width:420px" disabled>Show it on the lights!</button>

<div id="timer"></div>
<div id="msg">Connecting...</div>
<div id="note"></div>
<script>
  const el = (id) => document.getElementById(id);
  let app = null, status = { phase: 'idle', players: [] }, skew = 0, lastNoteText = '', lastNoteAt = 0;
  try { el('name').value = localStorage.getItem('spName') || ''; } catch (e) {}
  el('name').addEventListener('input', () => { try { localStorage.setItem('spName', el('name').value); } catch (e) {} });
  const myName = () => el('name').value.trim();
  const me = () => (app && (status.players || []).find((p) => p.id === app.clientId)) || null;
  const meIndex = () => (app ? (status.players || []).findIndex((p) => p.id === app.clientId) : -1);
  const nowMs = () => Date.now() + skew;
  const say = (t) => { el('msg').textContent = t; };
  const send = (o) => (app ? app.send(o).catch((e) => { el('note').textContent = 'Could not send: ' + e.message; lastNoteAt = Date.now(); }) : Promise.resolve());
  function seg(box, list, cur, set) {
    box.replaceChildren(...list.map(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur));
      b.addEventListener('click', () => { set(v); render(); }); return b;
    }));
  }
  const secsLeft = (at) => Math.max(0, Math.ceil((at - nowMs()) / 1000));
  let draw = () => {}, tickGame = () => '', onStatus = () => {};
  let tab = 'text', colour = 1, fx = '', gif = '', gifKey = '', pen = 2, grid = null, gw = 0, gh = 0, painting = false;
  el('namePanel').classList.add('hidden');
  const TABS = [['text', '💬 Message'], ['gif', '🎞️ Picture'], ['fx', '✨ Effect'], ['draw', '🖌️ Draw']];
  function swatches(box, cur, set, from = 1) {
    box.replaceChildren(...(status.colors || []).slice(from).map((c, k) => {
      const i = k + from, b = document.createElement('button'); b.type = 'button'; b.style.background = '#' + c; b.setAttribute('aria-label', 'Colour ' + i);
      b.setAttribute('aria-pressed', String(i === cur)); b.addEventListener('click', () => { set(i); render(); }); return b;
    }));
  }
  function paint(e) {
    const r = el('canvas').getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * gw), y = Math.floor((e.clientY - r.top) / r.height * gh);
    if (x < 0 || y < 0 || x >= gw || y >= gh) return;
    grid[y * gw + x] = pen; drawCanvas();
  }
  function drawCanvas() {
    const c = el('canvas'), g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, gw, gh);
    for (let i = 0; i < grid.length; i++) if (grid[i]) { g.fillStyle = '#' + status.colors[grid[i]]; g.fillRect(i % gw, Math.floor(i / gw), 1, 1); }
  }
  el('canvas').addEventListener('pointerdown', (e) => { painting = true; el('canvas').setPointerCapture(e.pointerId); paint(e); });
  el('canvas').addEventListener('pointermove', (e) => { if (painting) paint(e); });
  el('canvas').addEventListener('pointerup', () => { painting = false; });
  el('clear').addEventListener('click', () => { grid.fill(0); drawCanvas(); });
  draw = () => {
    const s = status, a = s.allow || { text: true, fx: true, draw: true, gif: false };
    const tabs = TABS.filter(([k]) => a[k] !== false);
    if (!tabs.some(([k]) => k === tab) && tabs.length) tab = tabs[0][0];
    seg(el('tabs'), tabs, tab, (v) => { tab = v; });
    el('tabs').classList.toggle('hidden', tabs.length < 2);
    el('pText').classList.toggle('hidden', tab !== 'text'); el('pGif').classList.toggle('hidden', tab !== 'gif'); el('pFx').classList.toggle('hidden', tab !== 'fx'); el('pDraw').classList.toggle('hidden', tab !== 'draw');
    el('text').classList.toggle('hidden', s.free === false); el('textLabel').textContent = s.free === false ? 'Pick a message' : 'Your message';
    el('presets').replaceChildren(...(s.presets || []).map((p) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = p; b.addEventListener('click', () => { el('text').value = p; }); return b; }));
    swatches(el('colours'), colour, (v) => { colour = v; });
    el('fxs').replaceChildren(...(s.fx || []).map(([k, n]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.setAttribute('aria-pressed', String(k === fx)); b.addEventListener('click', () => { fx = k; render(); }); return b; }));
    swatches(el('pens'), pen, (v) => { pen = v; }, 0);
    const gl = s.gifs || [];
    if (!gl.some(([f]) => f === gif)) gif = '';
    const gk = JSON.stringify(gl) + gif;
    if (gk !== gifKey) {   // the pictures are drawn again only when the list or the choice changes, so they keep animating
      gifKey = gk;
      el('gifs').replaceChildren(...gl.map(([f, n]) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(f === gif));
        const im = document.createElement('img'); im.src = 'gifs/' + f; im.alt = ''; b.append(im, n); b.addEventListener('click', () => { gif = f; render(); }); return b; }));
    }
    if (s.drawSize && (s.drawSize[0] !== gw || s.drawSize[1] !== gh)) {
      [gw, gh] = s.drawSize; grid = new Uint8Array(gw * gh); el('canvas').width = gw; el('canvas').height = gh;
      el('canvas').style.aspectRatio = gw + ' / ' + gh; el('canvas').style.maxHeight = '55vh'; el('canvas').style.width = 'auto'; el('canvas').style.maxWidth = '100%';
    }
    if (grid) drawCanvas();
    el('send').disabled = !app || s.phase === 'unconfigured';
    const mine = (s.queue || []).findIndex((q) => app && q.id === app.clientId);
    let t = s.message || '';
    if (s.now && app && s.now.id === app.clientId) t = '✨ Yours is on the lights now!';
    else if (mine >= 0) t = mine === 0 ? 'Yours is next!' : 'Yours is number ' + (mine + 1) + ' in line.';
    say(t);
  };
  el('send').addEventListener('click', () => {
    if (tab === 'text') { const t = el('text').value.trim(); if (!t) { el('note').textContent = 'Write or pick a message first.'; return; } send({ type: 'text', text: t, color: colour }); }
    else if (tab === 'gif') { if (!gif) { el('note').textContent = 'Pick a picture first.'; return; } send({ type: 'gif', f: gif }); }
    else if (tab === 'fx') { if (!fx) { el('note').textContent = 'Pick an effect first.'; return; } send({ type: 'fx', fx }); }
    else { if (!grid.some((v) => v)) { el('note').textContent = 'Draw something first.'; return; } send({ type: 'draw', w: gw, h: gh, px: Array.from(grid).join('') }); }
    el('send').disabled = true; say('Sending…'); setTimeout(render, 1200);
  });

  function render() {
    draw();
    el('timer').textContent = tickGame() || '';
    const n = app && status.notices && status.notices[app.clientId];
    if (n && n !== lastNoteText) { lastNoteText = n; lastNoteAt = Date.now(); el('note').textContent = n; }
    if (!n) lastNoteText = '';
    if (Date.now() - lastNoteAt > 5000) el('note').textContent = '';
  }
  function init() {
    app = EZApp.connect();
    app.onStatus((s, snap) => {
      if (!s) return;
      if (snap && typeof snap.at === 'number') skew = snap.at - Date.now();
      const old = status; status = s; onStatus(old, s);
      render();
    });
    app.ready.then(render).catch((e) => say('Could not reach the player: ' + e.message));
    setInterval(() => { el('timer').textContent = tickGame() || ''; }, 250);
    render();
  }
  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => say('Could not load the app SDK.');
  document.head.appendChild(sdk);
</script>
</body>
</html>
