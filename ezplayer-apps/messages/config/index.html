<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages on the lights settings</title>
<style>
  :root { color-scheme: dark; --bg: #0d0a16; --panel: #1a1428; --line: #3a2d52; --text: #fff; --dim: #bfb3d4; --accent: #ffc83c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 24px 0 4px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  label { display: block; margin: 12px 0 4px; color: var(--dim); font-size: 14px; }
  textarea { width: 100%; min-height: 110px; font: 14px/1.4 ui-monospace, Consolas, monospace; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  select, input[type=number], input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .checks { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .checks label { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--text); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: none; padding: 2px; }
  button { font: inherit; font-weight: 600; color: #1a1200; background: var(--accent); border: 0; border-radius: 10px; padding: 12px 20px; margin-top: 18px; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  #note { margin-left: 12px; color: var(--dim); }
  details { margin-top: 24px; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; overflow: auto; max-height: 50vh; white-space: pre-wrap; }
  .hint { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .picker { max-height: 220px; overflow: auto; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .picker button { margin: 0; padding: 6px 10px; font-size: 13px; font-weight: 500; color: var(--text); background: #2a2140; border: 1px solid var(--line); border-radius: 999px; }
  .picker button.g { border-color: var(--accent); }
</style>
</head>
<body>
<h1>💬 Messages on the lights settings</h1>
<p class="hint">Visitors send a message (their own words or one of yours), an effect of the season, or their own drawing, and each is shown on the matrix in turn. Messages go through a word filter. Pick the matrix, then Save.</p>
<div id="matrixBlock">
<h2>The matrix</h2>
<label for="target">Matrix (any model at least 8 x 5 pixels)</label>
<select id="target"><option value="">Loading models...</option></select>
<p class="hint" id="targetsNote"></p>
</div>
<div class="row">
  <div><label for="fps">Frames per second (5 to 30)</label><input id="fps" type="number" min="5" max="30" step="1" value="25"></div>
  <div><label for="brightness">Brightness (%)</label><input id="brightness" type="number" min="10" max="100" step="5" value="100"></div>
</div>
<div id="fields"></div>
<button id="save" disabled>Save</button><span id="note"></span>
<details>
  <summary>Current status (debug)</summary>
  <pre id="status">No status yet.</pre>
</details>
<script>
  const el = (id) => document.getElementById(id);
  const MIN = { w: 8, h: 5 };
  const FIELDS = [{"id": "theme", "type": "select", "label": "Effects of", "options": [["xm", "Christmas"], ["hw", "Halloween"], ["ev", "Other celebrations"]], "default": "xm", "end": true}, {"id": "text", "type": "check", "text": "Messages", "default": true}, {"id": "fx", "type": "check", "text": "Effects", "default": true}, {"id": "draw", "type": "check", "text": "Drawings", "default": true}, {"id": "free", "type": "check", "text": "Visitors may write their own message (word filter on); off: only the messages below", "default": true}, {"id": "presets", "type": "textarea", "label": "Messages to pick from (one a line, up to 40 letters)", "default": "Merry Christmas!\nHappy holidays!\nHo ho ho!\nLet it snow!", "end": true}, {"section": "Timing"}, {"id": "textSecs", "type": "number", "label": "Seconds for a message (at least one full scroll)", "min": 5, "max": 120, "default": 15}, {"id": "fxSecs", "type": "number", "label": "Seconds for an effect", "min": 5, "max": 120, "default": 15}, {"id": "drawSecs", "type": "number", "label": "Seconds for a drawing", "min": 5, "max": 120, "default": 15, "end": true}, {"id": "waitSecs", "type": "number", "label": "Each phone waits (seconds)", "min": 0, "max": 600, "default": 20}, {"id": "queueMax", "type": "number", "label": "Most requests waiting", "min": 1, "max": 50, "default": 10}];
  const TARGET = "required";   // 'required', 'optional' (a matrix is not needed) or 'none' (no matrix at all)
  if (TARGET === 'none') el('matrixBlock').querySelectorAll('h2, label, select, .hint').forEach((x) => x.style.display = 'none');
  let app;
  // a list of the show's models and groups: a click adds the name to the field it serves, at the cursor
  async function fillPickers() {
    const pk = FIELDS.filter((f) => f.type === 'models');
    if (!pk.length) return;
    let models = [], groups = {};
    try {
      if (app.apiBase !== null) { const r = await fetch(`${app.apiBase}/api/ezp/overlays/targets`); if (r.ok) models = ((await r.json()).targets || []).map((t) => t.model); }
    } catch (e) { /* listed only on the home network */ }
    try { groups = (await app.get('private', 'groups')) || {}; } catch (e) { /* the app writes the groups once it has read the show */ }
    for (const f of pk) {
      const box = el('pk_' + f.id), q = el('pq_' + f.id);
      const show = () => {
        const s = q.value.trim().toLowerCase();
        const items = [...Object.keys(groups).map((g) => [g, true]), ...models.map((m) => [m, false])].filter(([n]) => !s || n.toLowerCase().includes(s)).slice(0, 300);
        box.replaceChildren(...items.map(([n, g]) => {
          const b = document.createElement('button'); b.type = 'button'; b.textContent = (g ? '👥 ' : '') + n; if (g) b.className = 'g';
          b.title = g ? 'Group: ' + groups[n].join(', ') : 'Model';
          b.addEventListener('click', () => {
            const t = el('f_' + f.for), at = t.selectionStart ?? t.value.length, before = t.value.slice(0, at), after = t.value.slice(at);
            const sep = !before || /[|,\n]\s*$/.test(before) ? (/[|,]$/.test(before) ? ' ' : '') : ', ';
            t.value = before + sep + n + after; t.focus(); t.selectionStart = t.selectionEnd = (before + sep + n).length;
          });
          return b;
        }));
        if (!items.length) box.textContent = app.apiBase === null ? 'The models are listed only on the home network.' : 'No model found.';
      };
      q.addEventListener('input', show); show();
    }
  }
  function build() {
    const box = el('fields');
    let row = null;
    for (const f of FIELDS) {
      if (f.section) { const h = document.createElement('h2'); h.textContent = f.section; box.append(h); row = null; continue; }
      if (f.type === 'checks' || f.type === 'check') {
        const wrap = document.createElement('div');
        if (f.label) { const l = document.createElement('label'); l.textContent = f.label; wrap.append(l); }
        const c = document.createElement('div'); c.className = 'checks';
        for (const [v, t] of f.type === 'check' ? [[f.id, f.text]] : f.options) {
          const l = document.createElement('label'); const i = document.createElement('input'); i.type = 'checkbox';
          i.dataset.f = f.id; i.value = v; l.append(i, ' ' + t); c.append(l);
        }
        wrap.append(c); box.append(wrap); row = null;
        if (f.hint) { const p = document.createElement('p'); p.className = 'hint'; p.textContent = f.hint; box.append(p); }
        continue;
      }
      if (f.type === 'models') {
        const wrap = document.createElement('div');
        const l = document.createElement('label'); l.textContent = f.label; l.htmlFor = 'pq_' + f.id;
        const q = document.createElement('input'); q.type = 'text'; q.id = 'pq_' + f.id; q.placeholder = 'Search models and groups (👥)…';
        const pkb = document.createElement('div'); pkb.className = 'picker'; pkb.id = 'pk_' + f.id; pkb.textContent = 'Loading…';
        wrap.append(l, q, pkb); box.append(wrap); row = null;
        if (f.hint) { const p = document.createElement('p'); p.className = 'hint'; p.textContent = f.hint; box.append(p); }
        continue;
      }
      if (!row) { row = document.createElement('div'); row.className = 'row'; box.append(row); }
      const cell = document.createElement('div');
      const l = document.createElement('label'); l.textContent = f.label; l.htmlFor = 'f_' + f.id;
      let i;
      if (f.type === 'select') { i = document.createElement('select'); for (const [v, t] of f.options) i.append(new Option(t, v)); }
      else if (f.type === 'textarea') { i = document.createElement('textarea'); if (f.placeholder) i.placeholder = f.placeholder; cell.style.gridColumn = '1 / -1'; }
      else { i = document.createElement('input'); i.type = f.type; if (f.placeholder) i.placeholder = f.placeholder; if (f.type === 'text') cell.style.gridColumn = '1 / -1'; if (f.type === 'number') { i.min = f.min; i.max = f.max; i.step = f.step || 1; } }
      i.id = 'f_' + f.id; i.dataset.f = f.id;
      cell.append(l, i); row.append(cell);
      if (f.hint) { const p = document.createElement('p'); p.className = 'hint'; p.textContent = f.hint; cell.append(p); }
      if (f.end) row = null;
    }
  }
  function fill(s) {
    if (typeof s.fps === 'number') el('fps').value = s.fps;
    if (typeof s.brightness === 'number') el('brightness').value = s.brightness;
    for (const f of FIELDS) {
      if (f.section || f.type === 'models') continue;
      const v = s[f.id] !== undefined ? s[f.id] : f.default;
      if (f.type === 'checks') for (const c of document.querySelectorAll(`[data-f="${f.id}"]`)) c.checked = Array.isArray(v) && v.includes(c.value);
      else if (f.type === 'check') document.querySelector(`[data-f="${f.id}"]`).checked = !!v;
      else if (f.type === 'color') el('f_' + f.id).value = '#' + v;
      else el('f_' + f.id).value = v;
    }
  }
  function gather() {
    const clamp = (i, lo, hi, st = 1) => { const x = Math.min(hi, Math.max(lo, Number(i.value) || lo)), v = Math.round(Math.round(x / st) * st * 1000) / 1000; i.value = v; return v; };
    const out = { target: el('target').value, fps: clamp(el('fps'), 5, 30), brightness: clamp(el('brightness'), 10, 100) };
    for (const f of FIELDS) {
      if (f.section || f.type === 'models') continue;
      if (f.type === 'checks') out[f.id] = [...document.querySelectorAll(`[data-f="${f.id}"]:checked`)].map((c) => c.value);
      else if (f.type === 'check') out[f.id] = document.querySelector(`[data-f="${f.id}"]`).checked;
      else if (f.type === 'color') out[f.id] = el('f_' + f.id).value.slice(1);
      else if (f.type === 'number') out[f.id] = clamp(el('f_' + f.id), f.min, f.max, f.step || 1);
      else out[f.id] = f.numeric ? Number(el('f_' + f.id).value) : el('f_' + f.id).value;
    }
    return out;
  }
  async function loadTargets(current) {
    if (app.apiBase === null) {
      el('target').replaceChildren(new Option(current || 'Open this page on the home network to pick a matrix', current || ''));
      el('target').disabled = true;
      el('targetsNote').textContent = 'The list of models is only available on the home network; the other settings can still be saved.';
      return;
    }
    const res = await fetch(`${app.apiBase}/api/ezp/overlays/targets`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { targets = [] } = await res.json();
    const rows = targets.filter((t) => t.width >= MIN.w && t.height >= MIN.h)
      .map((t) => ({ name: t.model, label: `${t.model} (${t.width} x ${t.height})` }))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
    const sel = el('target');
    sel.replaceChildren(new Option(TARGET === 'optional' ? 'None' : 'Pick a matrix...', ''));
    for (const r of rows) sel.append(new Option(r.label, r.name));
    if (current && !rows.some((r) => r.name === current)) sel.append(new Option(`${current} (not in this layout)`, current));
    sel.value = current || '';
    if (!rows.length) el('targetsNote').textContent = `No matrix found: the show has no model at least ${MIN.w} x ${MIN.h} pixels.`;
  }
  async function init() {
    build();
    app = EZApp.connect();
    try { await app.ready; } catch (e) { el('note').textContent = `Could not reach the player: ${e.message}`; return; }
    app.onStatus((s) => { el('status').textContent = JSON.stringify(s, null, 2); });
    let settings = null;
    try { settings = await app.get('private', 'settings'); } catch (e) { /* not readable here; the form keeps its defaults */ }
    fill(settings || {});
    if (TARGET !== 'none') { try { await loadTargets(settings?.target); } catch (e) { el('note').textContent = `Could not list models: ${e.message}`; } }
    fillPickers();
    el('save').disabled = false;
  }
  el('save').addEventListener('click', async () => {
    const body = gather();
    if (!body.target && TARGET === 'required') { el('note').textContent = 'Pick a matrix first.'; return; }

    el('save').disabled = true;
    try {
      await app.put('private', 'settings', body);
      el('note').textContent = TARGET === 'required' ? 'Saved. The app picks it up within a few seconds (after the current game).' : 'Saved. The app picks it up within a few seconds.';
    } catch (e) {
      el('note').textContent = `Save failed: ${e.message}`;
    }
    el('save').disabled = false;
  });
  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => { el('note').textContent = 'Could not load the app SDK.'; };
  document.head.appendChild(sdk);
</script>
</body>
</html>
